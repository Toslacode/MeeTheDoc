<title>RoboTask</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================ TOKENS ============================
   Light palette taken from the approved reference comps: cool near-white
   ground, white cards, deep navy ink, vivid clinical blue accent, and a
   dark navy navigation rail. Dark theme mirrors the same hierarchy.   */
:root{
  /* warm ivory ground, cards a warm off-white step lighter, cool-grey
     structure, clinical blue reserved for actions */
  --bg:#F5F2EA; --bg-2:#EDE8DC;
  --surface:#FFFDF9; --surface-2:#F8F5EE; --surface-3:#F0EBE0;
  --border:#E6DFD1; --border-2:#D6CDBA;
  --ink:#1B2637; --ink-2:#41506A; --ink-dim:#6B7891; --ink-faint:#9AA3B2;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#EAF1FE; --accent-line:#BFD6FE;
  --rail:#1D2739; --rail-2:#2C3A52; --rail-ink:#CBD5E6; --rail-dim:#8494B0;
  --urgent:#C8372D; --urgent-soft:#FBEFEB; --urgent-line:#F2D2C9;
  --warn:#B4761A; --warn-soft:#FBF3E2; --warn-line:#EEDBB0;
  --stable:#12805C; --stable-soft:#EAF4EC; --stable-line:#BFDFCB;
  --done:#6B7891; --done-soft:#F0EDE5;
  --cc-strategy:#059669; --cc-tests:#2563EB; --cc-imaging:#0891B2; --cc-treatments:#7C3AED;
  --cc-meds:#C026D3;     --cc-consults:#EA580C; --cc-tasks:#4F46E5; --cc-documents:#0D9488;
  --cc-family:#CA8A04;   --cc-discharge:#DB2777; --cc-social:#65A30D; --cc-decisions:#DC2626;
  --cc-tint:6%; --cc-edge:20%;
  --shadow-sm:0 1px 2px rgba(74,58,38,.06);
  --shadow:0 1px 3px rgba(74,58,38,.06), 0 6px 16px -8px rgba(74,58,38,.16);
  --shadow-lg:0 22px 56px -20px rgba(58,46,30,.26), 0 2px 6px rgba(74,58,38,.07);
  --r:14px;
  /* Motion. Critically damped by default (Apple: damping 1.0, response .3-.4);
     overshoot is reserved for motion a gesture actually threw. */
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-momentum:cubic-bezier(.2,.9,.3,1.22);
  --t-press:110ms; --t-base:320ms; --t-move:400ms;
  /* Tracking is size-specific: tighten as type grows, ease open as it shrinks. */
  --track-display:-.03em; --track-title:-.02em; --track-body:0em; --track-small:.005em;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B1017; --bg-2:#080C12;
  --surface:#131B25; --surface-2:#18212D; --surface-3:#1E2937;
  --border:#243040; --border-2:#31404F;
  --ink:#E8EEF5; --ink-2:#BFCBDA; --ink-dim:#93A2B4; --ink-faint:#6C7A8B;
  --accent:#5B9BFF; --accent-ink:#05121F; --accent-soft:#122443; --accent-line:#26456F;
  --rail:#0E151F; --rail-2:#1D2B41; --rail-ink:#C3D0E2; --rail-dim:#7C8CA5;
  --urgent:#F27171; --urgent-soft:#2A1517; --urgent-line:#482325;
  --warn:#E0A84A; --warn-soft:#2A2013; --warn-line:#4A381C;
  --stable:#4FC08D; --stable-soft:#0F2A20; --stable-line:#22483300;
  --stable-line:#224833; --done:#7B8A9C; --done-soft:#19222D;
  --cc-strategy:#34D399; --cc-tests:#60A5FA; --cc-imaging:#22D3EE; --cc-treatments:#A78BFA;
  --cc-meds:#E879F9;     --cc-consults:#FB923C; --cc-tasks:#818CF8; --cc-documents:#2DD4BF;
  --cc-family:#FACC15;   --cc-discharge:#F472B6; --cc-social:#A3E635; --cc-decisions:#F87171;
  --cc-tint:17%; --cc-edge:42%;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1017; --bg-2:#080C12;
  --surface:#131B25; --surface-2:#18212D; --surface-3:#1E2937;
  --border:#243040; --border-2:#31404F;
  --ink:#E8EEF5; --ink-2:#BFCBDA; --ink-dim:#93A2B4; --ink-faint:#6C7A8B;
  --accent:#5B9BFF; --accent-ink:#05121F; --accent-soft:#122443; --accent-line:#26456F;
  --rail:#0E151F; --rail-2:#1D2B41; --rail-ink:#C3D0E2; --rail-dim:#7C8CA5;
  --urgent:#F27171; --urgent-soft:#2A1517; --urgent-line:#482325;
  --warn:#E0A84A; --warn-soft:#2A2013; --warn-line:#4A381C;
  --stable:#4FC08D; --stable-soft:#0F2A20; --stable-line:#224833;
  --done:#7B8A9C; --done-soft:#19222D;
  --cc-strategy:#34D399; --cc-tests:#60A5FA; --cc-imaging:#22D3EE; --cc-treatments:#A78BFA;
  --cc-meds:#E879F9;     --cc-consults:#FB923C; --cc-tasks:#818CF8; --cc-documents:#2DD4BF;
  --cc-family:#FACC15;   --cc-discharge:#F472B6; --cc-social:#A3E635; --cc-decisions:#F87171;
  --cc-tint:17%; --cc-edge:42%;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); direction:rtl;
  font-family:"Heebo",-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; letter-spacing:-.006em;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
svg{display:block;flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============================ SHELL ============================ */
#app{display:flex;min-height:100vh}

/* dark navigation rail — from the patient-canvas reference */
.rail{
  width:88px;flex:none;height:100vh;position:sticky;top:0;background:var(--rail);
  display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:3px;overflow-y:auto;
}
.rail-logo{width:44px;height:44px;border-radius:13px;overflow:hidden;flex:none;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rail-logo img{width:100%;height:100%;object-fit:cover;display:block}
.rail-item{
  width:100%;padding:9px 4px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--rail-dim);font-size:10.5px;font-weight:600;line-height:1.2;text-align:center;transition:background .16s,color .16s;
}
.rail-item:hover{background:rgba(255,255,255,.07);color:var(--rail-ink)}
.rail-item.active{background:var(--rail-2);color:#fff}
.rail-item span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rail-sep{width:34px;height:1px;background:rgba(255,255,255,.12);margin:8px 0}
.rail-foot{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:10px}
.rail-theme{display:flex;gap:3px;background:rgba(255,255,255,.07);padding:3px;border-radius:10px}
.rail-theme button{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--rail-dim)}
.rail-theme button.active{background:rgba(255,255,255,.16);color:#fff}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--surface);
  box-shadow:0 1px 0 color-mix(in srgb,var(--border) 72%,transparent),0 10px 18px -18px rgba(30,22,10,.28)}
.topbar h1{font-size:18px}
.tb-end{margin-inline-start:auto;display:flex;align-items:center;gap:9px}
.role-select{
  appearance:none;padding:7px 26px 7px 11px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(11px) calc(50% - 2px),calc(15px) calc(50% - 2px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.searchbox{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:11px;padding:8px 12px;transition:border-color .16s,box-shadow .16s;
}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--ink);font-size:13px}
.kbd{font-size:10px;font-weight:700;color:var(--ink-faint);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 5px;flex:none}
.iconbtn{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-dim);position:relative;transition:color .16s,border-color .16s;
}
.iconbtn:hover{color:var(--accent);border-color:var(--accent-line)}
.iconbtn .badge{
  position:absolute;top:-4px;inset-inline-end:-4px;min-width:16px;height:16px;border-radius:99px;background:var(--urgent);
  color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--surface);
}
.me{display:flex;align-items:center;gap:8px;padding-inline-start:10px;border-inline-start:1px solid var(--border)}
.me .nm{line-height:1.2}
.me .nm b{font-size:12.5px;font-weight:700;display:block}
.me .nm span{font-size:10.5px;color:var(--accent);font-weight:600}
.content{flex:1;overflow-y:auto;padding:18px 20px 60px}

/* ============================ PRIMITIVES ============================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1180px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;align-items:center;gap:9px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sec-head h2{font-size:14.5px}
.sec-head .sp{margin-inline-start:auto}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.hint{font-size:11.5px;color:var(--ink-dim);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
.pill.urgent{background:var(--urgent-soft);color:var(--urgent);border-color:var(--urgent-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.stable{background:var(--stable-soft);color:var(--stable);border-color:var(--stable-line)}
.pill.done{background:var(--done-soft);color:var(--done);border-color:var(--border)}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.ghost{background:var(--surface-2);color:var(--ink-dim);border-color:var(--border)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:700;font-size:12.5px;
  transition:transform var(--t-press) var(--ease),background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.btn:hover{border-color:var(--border-2)}
.btn:active{transform:scale(.965)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:8px}
.btn.block{width:100%}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent)}
.linkbtn:hover{text-decoration:underline}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;color:var(--ink-faint);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:10px 13px;border-bottom:1px solid var(--border)}
td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowbtn:hover{background:var(--surface-2);cursor:pointer}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-dim);font-weight:600}
.empty{padding:30px 16px;text-align:center;color:var(--ink-faint);font-size:12.5px}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:var(--cc,var(--accent));transition:width .5s var(--ease)}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-dim);transition:all .15s}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-faint);transition:all .15s}
.seg button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}

/* metric tile — reference: soft tinted icon square beside a big number */
.metric{display:flex;align-items:center;gap:11px;padding:14px}
.metric .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.metric .num{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.metric .lbl{font-size:11.5px;color:var(--ink-2);font-weight:700;line-height:1.25}
.metric .sub{font-size:10.5px;color:var(--ink-faint);font-weight:600}

/* portrait */
.pt{border-radius:99px;overflow:hidden;flex:none;background:var(--surface-3);position:relative}
.pt svg{width:100%;height:100%}
.pt-ring{position:absolute;inset:-3px;border-radius:99px;border:2px solid;pointer-events:none}

/* ============================ MODALS / TOAST ============================ */
.modal-back{position:fixed;inset:0;background:rgba(38,30,20,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;animation:fade .18s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .26s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.975);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px}
.modal-body{padding:17px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-dim)}
.field input,.field select,.field textarea{
  padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:13px;outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:62px}
.toast-wrap{position:fixed;bottom:22px;inset-inline:0;display:flex;justify-content:center;z-index:300;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:99px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);animation:toastin var(--t-base) var(--ease);max-width:min(560px,88vw)}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.fade{animation:fadeup .26s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ==================== LOGIN (demo entry screen) ==================== */
.lg{
  position:relative;min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
  padding:32px 20px;overflow:hidden;background:var(--bg);
}
/* two slow blurred glows plus a faint node field — calm, not flashy */
.lg-glow{position:absolute;border-radius:99px;pointer-events:none;filter:blur(70px);opacity:.5}
.lg-glow.a{width:620px;height:620px;inset-inline-end:-160px;top:-200px;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 42%,transparent),transparent 70%);
  animation:lgFloatA 26s ease-in-out infinite}
.lg-glow.b{width:560px;height:560px;inset-inline-start:-150px;bottom:-190px;
  background:radial-gradient(circle,color-mix(in srgb,var(--cc-imaging) 38%,transparent),transparent 70%);
  animation:lgFloatB 32s ease-in-out infinite}
@keyframes lgFloatA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-46px,54px,0) scale(1.09)}}
@keyframes lgFloatB{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(52px,-42px,0) scale(1.12)}}
.lg-nodes{position:absolute;inset:0;pointer-events:none;opacity:.5}
.lg-nodes i{
  position:absolute;width:4px;height:4px;border-radius:99px;
  background:color-mix(in srgb,var(--accent) 55%,transparent);
  animation:lgDrift 20s ease-in-out infinite;
}
@keyframes lgDrift{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-26px);opacity:.75}}
.lg-grid{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at 50% 45%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 0%,transparent 72%);
}
.lg-inner{position:relative;z-index:2;width:100%;max-width:410px;animation:lgIn .6s var(--ease) both}
@keyframes lgIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.lg-brand{display:flex;flex-direction:column;align-items:center;gap:11px;margin-bottom:22px;text-align:center}
.lg-mark{
  width:78px;height:78px;border-radius:23px;overflow:hidden;box-shadow:var(--shadow-lg);
  animation:lgMark 5.5s ease-in-out infinite;
}
.lg-mark img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes lgMark{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lg-name{font-size:31px;font-weight:800;letter-spacing:-.045em;line-height:1}
.lg-tag{font-size:13px;color:var(--ink-dim);font-weight:600;letter-spacing:-.005em}
/* real glass: the drifting glows read through it, and the bright top edge is
   the light catching the material (§12) */
.lg-card{
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  border:1px solid var(--border);
  border-top-color:color-mix(in srgb,#fff 60%,var(--border));
  border-radius:20px;padding:22px;box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
}
.lg-roles{display:flex;gap:6px;margin-bottom:15px}
.lg-role{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-dim);
  font-size:11.5px;font-weight:700;transition:all .18s var(--ease);
}
.lg-role:hover{border-color:var(--border-2);color:var(--ink);transform:translateY(-1px)}
.lg-role.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lg-f{margin-bottom:12px;animation:lgIn .5s var(--ease) both}
.lg-f label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-dim);margin-bottom:5px}
.lg-f .wrap{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);transition:border-color .18s,box-shadow .18s}
.lg-f .wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lg-f .wrap svg{color:var(--ink-faint)}
.lg-f input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--ink);font-size:13.5px}
.lg-btn{
  width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:800;
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  box-shadow:0 8px 20px -9px var(--accent);
  transition:transform var(--t-press) var(--ease),filter .16s var(--ease),box-shadow .16s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.lg-btn:hover{filter:brightness(1.07);transform:translateY(-2px);box-shadow:0 12px 26px -9px var(--accent)}
.lg-btn:active{transform:translateY(0) scale(.985)}
.lg-btn.ghost{
  background:transparent;color:var(--ink-2);border-color:var(--border-2);box-shadow:none;
  margin-top:9px;font-weight:700;font-size:13px;
}
.lg-btn.ghost:hover{background:var(--surface-2);color:var(--ink);box-shadow:none;transform:translateY(-1px)}
.lg-foot{margin-top:16px;text-align:center;font-size:10.5px;color:var(--ink-faint);font-weight:600;line-height:1.6}
.lg-out{animation:lgOut .34s cubic-bezier(.4,0,1,1) both}
@keyframes lgOut{to{opacity:0;transform:scale(1.03)}}



/* ==================== PATIENT CANVAS (priority 1) ==================== */
.cv{display:flex;align-items:stretch;gap:0;height:100%}
.cv-plist{
  width:252px;flex:none;background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.cv-plist-head{padding:12px;border-bottom:1px solid var(--border);flex:none;display:flex;flex-direction:column;gap:9px}
.cv-plist-head .row2{display:flex;gap:7px}
.cv-plist-head .searchbox{flex:1;padding:7px 10px}
.cv-plist-title{display:flex;align-items:center;justify-content:space-between;padding:10px 13px 6px;font-size:12px;font-weight:700;color:var(--ink-dim);flex:none}
.cv-plist-body{overflow-y:auto;padding:0 9px 9px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard{
  display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);text-align:start;width:100%;transition:all .16s;
}
.pcard:hover{border-color:var(--border-2);background:var(--surface-2)}
.pcard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.pcard .nm{font-size:13px;font-weight:700;line-height:1.2}
.pcard .rm{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:1px}
.pcard .stt{font-size:10.5px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px}
.cv-plist-foot{padding:10px 13px;border-top:1px solid var(--border);flex:none;text-align:center}

.cv-mid{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
/* facts strip — labelled columns, exactly as the reference header row */
.facts{
  display:flex;align-items:stretch;gap:0;padding:11px 18px;background:var(--surface);
  border-bottom:1px solid var(--border);flex:none;overflow-x:auto;
}
.fact{padding:0 18px;display:flex;flex-direction:column;gap:3px;border-inline-end:1px solid var(--border);white-space:nowrap}
.fact:last-child{border-inline-end:none}
.fact .fl{font-size:10.5px;color:var(--ink-faint);font-weight:600}
.fact .fv{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.cv-canvas{flex:1;overflow:auto;padding:16px}

#mindmap{position:relative;min-height:100%}
#mmSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#mmSvg path{fill:none;stroke-width:1.1;opacity:.34;stroke-linecap:round;transition:stroke-width .2s,opacity .2s}
#mmSvg path.hot{stroke-width:2;opacity:.9}
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;position:relative;z-index:1;align-items:start}
.mm-hub{grid-column:2 / span 2;grid-row:2 / span 2;align-self:stretch;display:flex;align-items:center;justify-content:center;min-height:340px;padding:26px}
/* the patient is a circle at the centre — the strongest object on screen */
.hub{
  width:236px;height:236px;border-radius:99px;position:relative;flex:none;
  background:var(--surface);border:3px solid var(--accent-line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
/* soft halo, not a hard ring — keeps the patient dominant without shouting */
.hub::before{
  content:"";position:absolute;inset:-34px;border-radius:99px;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent) 0%,transparent 68%);
  filter:blur(6px);
}
#mindmap.dragging .hub{transform:scale(1.03);border-color:var(--accent);box-shadow:0 0 0 8px var(--accent-soft),var(--shadow-lg)}
.hub .pt{position:absolute;inset:9px;border-radius:99px}
.hub-txt{
  position:absolute;inset-inline:6px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(to top,var(--surface) 62%,transparent);padding-top:28px;border-radius:0 0 99px 99px;
}
.hub-txt .n{font-size:19.5px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.hub-txt .m{font-size:12px;color:var(--ink-dim);font-weight:600;display:flex;align-items:center;gap:6px}
.hub-txt .m i{width:3px;height:3px;border-radius:99px;background:var(--ink-faint);display:block}
.hub-pill{position:absolute;bottom:-14px;inset-inline:0;display:flex;justify-content:center}

/* category card — tinted header, count badge, item list, footer link */
.catcard{
  background:var(--surface);border:1px solid color-mix(in srgb,var(--cc) var(--cc-edge),var(--border));
  border-radius:13px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  transition:box-shadow .2s,transform .2s var(--ease),border-color .2s;
}
.catcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.cat-head{
  display:flex;align-items:center;gap:8px;padding:9px 11px;width:100%;text-align:start;
  background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));
  border-bottom:1px solid color-mix(in srgb,var(--cc) 18%,var(--border));
}
.cat-head .ci{color:var(--cc);flex:none}
.cat-title{font-size:13px;font-weight:700;flex:1;min-width:0;line-height:1.2;color:var(--ink)}
.cat-count{
  font-size:12px;font-weight:800;min-width:24px;height:22px;padding:0 6px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--surface-3);color:var(--ink-dim);
}
.cat-urg{width:7px;height:7px;border-radius:99px;background:var(--urgent);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--urgent) 16%,transparent)}
.cat-openN{font-size:10.5px;font-weight:700;color:var(--ink-faint);flex:none;white-space:nowrap}
.cat-chev{color:var(--ink-faint);opacity:.8;transition:transform .28s var(--ease)}
.catcard.open .cat-chev{transform:rotate(180deg)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.catcard.open .cat-body{grid-template-rows:1fr}
.cat-body-inner{overflow:hidden}
.cat-list{padding:5px 4px}
.cat-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;width:100%;text-align:start;
  font-size:12.5px;font-weight:600;transition:background .14s;
}
.cat-item:not(:last-child){box-shadow:inset 0 -1px 0 var(--border)}
.cat-item:hover{background:var(--surface-2)}
.cat-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .stt{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;flex:none}
.stt.done{color:var(--stable)} .stt.progress{color:var(--accent)}
.stt.warn{color:var(--ink-faint)} .stt.urgent{color:var(--urgent)}
.cat-foot{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;width:100%;
  border-top:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink-dim);
  background:var(--surface-2);transition:background .15s,color .15s;
}
.cat-foot:hover{background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));color:var(--cc)}
.cat-empty{font-size:12px;color:var(--ink-faint);padding:8px 9px;line-height:1.45}
/* Treatment Strategy is the one card that keeps full colour weight — it
   answers "what are we trying to achieve", not just "what did we do". */
.catcard[data-cat="strategy"]{
  border-color:color-mix(in srgb,var(--cc) 38%,var(--border));
  box-shadow:var(--shadow-sm),0 10px 22px -12px color-mix(in srgb,var(--cc) 42%,transparent);
}
.catcard[data-cat="strategy"] .cat-head{
  background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 14%,var(--surface)),color-mix(in srgb,var(--cc) 5%,var(--surface)));
}
.catcard[data-cat="strategy"] .cat-title{font-size:14px;font-weight:800;color:var(--cc)}
.catcard[data-cat="strategy"] .cat-count{background:var(--cc);color:#fff}
.cat-goal{font-size:12px;color:var(--ink-2);padding:8px 11px 0;line-height:1.5}
.cat-goal b{display:block;font-size:10.5px;color:var(--ink-faint);font-weight:700;margin-bottom:2px}
.cat-bar{padding:8px 11px 10px;display:flex;align-items:center;gap:8px}
.cat-bar .progress{flex:1}
.cat-bar .pc{font-size:12.5px;font-weight:800;color:var(--cc)}

.catcard.dropok{border-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent),var(--shadow);animation:breathe 1.4s ease-in-out infinite;position:relative}
.catcard.dropok::after{
  content:"שחרר כאן";position:absolute;top:6px;inset-inline-start:6px;z-index:4;pointer-events:none;
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;
  background:var(--cc);color:#fff;box-shadow:var(--shadow);animation:fadeup .2s ease;
}
.catcard.dropover{border-color:var(--cc);box-shadow:0 0 0 5px color-mix(in srgb,var(--cc) 30%,transparent),var(--shadow-lg);transform:translateY(-3px) scale(1.02);transition:transform .2s var(--ease-momentum),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.catcard.dimmed{opacity:.36}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 20%,transparent),var(--shadow)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--cc) 26%,transparent),var(--shadow)}}
.catcard.flash{animation:flash .9s var(--ease-momentum)}
@keyframes flash{0%{box-shadow:0 0 0 0 transparent,var(--shadow)}25%{box-shadow:0 0 0 9px color-mix(in srgb,var(--cc) 30%,transparent),var(--shadow-lg)}100%{box-shadow:0 0 0 0 transparent,var(--shadow)}}

/* Clinical Toolbox — left panel, reference wording and grip rows */
.tbx{
  width:238px;flex:none;background:var(--surface);border-inline-start:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .3s var(--ease);
}
.tbx.collapsed{width:50px}
.tbx-head{padding:13px 12px 11px;border-bottom:1px solid var(--border);flex:none}
.tbx-head .t1{display:flex;align-items:center;gap:7px}
.tbx-head .t1 b{font-size:14.5px;font-weight:800;color:var(--accent);letter-spacing:-.01em;flex:1}
.tbx-head .t2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);font-weight:600;margin-top:5px}
.tbx.collapsed .t1 b,.tbx.collapsed .t2,.tbx.collapsed .tbx-search,.tbx.collapsed .tbx-body{display:none}
.tbx-search{padding:10px 11px;border-bottom:1px solid var(--border);flex:none}
.tbx-search .searchbox{padding:7px 10px}
.tbx-body{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.tcat{border-radius:11px;overflow:hidden;border:1px solid transparent;transition:border-color .16s,background .16s}
.tcat.open{border-color:color-mix(in srgb,var(--cc) 30%,var(--border));background:color-mix(in srgb,var(--cc) calc(var(--cc-tint) / 2),var(--surface))}
.tcat-head{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;text-align:start;font-size:13px;font-weight:700;transition:background .15s}
.tcat-head:hover{background:var(--surface-2)}
.tcat-head .ti{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));color:var(--cc)}
.tcat-head .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tcat-head .chev{color:var(--ink-faint);transition:transform .26s var(--ease)}
.tcat.open .chev{transform:rotate(180deg);color:var(--cc)}
.titems{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.tcat.open .titems{grid-template-rows:1fr}
.titems>div{overflow:hidden}
.titems ul{list-style:none;margin:0;padding:3px 6px 8px;display:flex;flex-direction:column;gap:5px}
.titem{
  display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;background:var(--surface);
  border:1px solid var(--border-2);font-size:12.5px;font-weight:600;cursor:grab;box-shadow:var(--shadow-sm);
  transition:transform .18s var(--ease-momentum),opacity .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease),box-shadow .18s var(--ease);
}
.titem:hover{border-color:var(--cc);background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));transform:translateY(-1px);box-shadow:var(--shadow)}
.titem:active{cursor:grabbing}
.titem.drag{will-change:transform;opacity:.62;transform:scale(1.035) rotate(-1deg);box-shadow:var(--shadow-lg);border-color:var(--cc);z-index:5}
.titem .grip{color:var(--ink-faint);flex:none}
.titem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the quick-add stays visible: a hover-only control is invisible to an audience */
.titem .add{
  flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border-2);background:var(--surface-2);color:var(--ink-dim);transition:all .15s;
}
.titem:hover .add,.titem .add:hover,.titem .add:focus-visible{background:var(--cc);border-color:var(--cc);color:#fff}

@media(max-width:1280px){
  .cv{flex-direction:column;height:auto}
  .cv-plist,.tbx,.tbx.collapsed{width:100%;border:none;border-bottom:1px solid var(--border)}
  .cv-plist-body{flex-direction:row;overflow-x:auto}
  .cv-plist-body .pcard{width:210px;flex:none}
  .tbx-body{max-height:250px}
  .cv-canvas{overflow:visible}
}
@media(max-width:920px){
  .mm-grid{grid-template-columns:repeat(2,1fr)}
  .mm-hub{grid-column:1 / -1;grid-row:auto;min-height:0}
  #mmSvg{display:none}
}

/* ==================== TIMELINE (priority 2) ==================== */
.tl-wrap{display:flex;gap:12px;align-items:flex-start}
.tl-main{flex:1;min-width:0;overflow:hidden}
.tl-side{width:280px;flex:none;display:flex;flex-direction:column;gap:11px}
@media(max-width:1280px){.tl-wrap{flex-direction:column}.tl-side{width:100%;flex-direction:row;flex-wrap:wrap}.tl-side>*{flex:1;min-width:240px}}
.subtabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;flex:none}
.subtab{padding:11px 14px;font-size:13px;font-weight:700;color:var(--ink-faint);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s}
.subtab:hover{color:var(--ink-2)}
.subtab.active{color:var(--accent);border-color:var(--accent)}
.tl-bar{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tl-week{font-size:13px;font-weight:700;text-align:center;line-height:1.25}
.tl-week span{display:block;font-size:11px;color:var(--ink-faint);font-weight:600}
.tl-scroll{overflow:auto;max-height:calc(100vh - 330px)}
.tl-grid{position:relative}
.tl-head{display:grid;position:sticky;top:0;z-index:6;border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(165%);backdrop-filter:blur(16px) saturate(165%)}
.tl-dc{padding:7px 5px;text-align:center;border-inline-start:1px solid var(--border)}
.tl-dc .dn{font-size:10.5px;font-weight:700;color:var(--ink-faint)}
.tl-dc .dd{font-size:14px;font-weight:800;letter-spacing:-.03em;margin-top:1px}
.tl-dc.today{background:var(--accent-soft)}
.tl-dc.today .dn,.tl-dc.today .dd{color:var(--accent)}
.tl-dc .tbadge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;margin-inline-start:4px}
.tl-gut{border-inline-start:1px solid var(--border)}
/* all-day band, from the reference's 00:00-08:00 monitoring row */
.tl-allday{display:grid;border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent);position:sticky;top:46px;z-index:5;
  background:color-mix(in srgb,var(--surface-2) 84%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
.tl-ad-cell{padding:5px 4px;border-inline-start:1px solid var(--border);min-height:34px}
.tl-ad{
  display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:7px;font-size:10px;font-weight:700;
  background:color-mix(in srgb,var(--cc-treatments) var(--cc-tint),var(--surface));
  border:1px solid color-mix(in srgb,var(--cc-treatments) 30%,var(--border));color:var(--cc-treatments);
}
.tl-ad .adt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-body{display:grid;position:relative}
.tl-hours{position:relative}
.tl-hr{position:absolute;inset-inline:0;text-align:center;font-size:10px;font-weight:700;color:var(--ink-faint);transform:translateY(-50%)}
.tl-col{position:relative;border-inline-start:1px solid var(--border)}
.tl-col.today{background:color-mix(in srgb,var(--accent) 3%,transparent)}
.tl-ln{position:absolute;inset-inline:0;height:1px;background:var(--border)}
.tl-ln.h{opacity:.42}
.tl-now{position:absolute;inset-inline:0;height:1.5px;background:var(--urgent);z-index:5}
.tl-now::before{content:"";position:absolute;inset-inline-start:-3px;top:-3.5px;width:8px;height:8px;border-radius:99px;background:var(--urgent)}
/* event block: white card with a thick coloured leading edge */
.tl-ev{
  position:absolute;border-radius:7px;padding:3px 6px;overflow:hidden;z-index:3;text-align:start;cursor:pointer;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--cc) 32%,var(--border));
  border-inline-start:3.5px solid var(--cc);box-shadow:var(--shadow-sm);
  transition:box-shadow .16s,z-index 0s;
}
.tl-ev:hover{inset-inline-start:3px !important;width:calc(100% - 7px) !important;box-shadow:var(--shadow-lg);z-index:20;opacity:1 !important}
.tl-ev .eh{display:flex;align-items:center;gap:4px}
.tl-ev .etm{font-size:9.5px;font-weight:700;color:var(--cc);font-family:"JetBrains Mono",monospace}
.tl-ev .eic{color:var(--cc);margin-inline-start:auto;opacity:.8}
.tl-ev .edep{color:var(--cc);opacity:.6;display:flex}
.tl-ev .et{font-size:10.5px;margin-top:1px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-ev.blocked{border-style:dashed;background:var(--surface-2)}
.tl-ev.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow);z-index:7}
#depSvg{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
#depSvg path{fill:none;stroke-width:1.1;stroke-dasharray:4 3;opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:7px;padding:10px 13px;border-top:1px solid var(--border)}
.legend span{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3.5px 9px;border-radius:99px;
  background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));
  border:1px solid color-mix(in srgb,var(--cc) 28%,var(--border));color:var(--cc);
}
/* dependency chain strip, from the reference's right-hand panel */
.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chain .cn{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;max-width:74px}
.chain .cn .cbox{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));border:1px solid color-mix(in srgb,var(--cc) 30%,var(--border));color:var(--cc)}
.chain .cn .cl{font-size:9.5px;font-weight:700;text-align:center;line-height:1.2;color:var(--ink-2)}
.chain .ar{color:var(--ink-faint);flex:none}
.aibox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:11px;padding:10px 11px;margin-top:10px}
.aibox .al{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.aibox .av{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.5}
.upd{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.upd:last-child{border-bottom:none}
.upd .ui{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));color:var(--cc);order:2;margin-inline-start:auto}
.upd .ub{flex:1;min-width:0}
.upd .ut{font-size:12.5px;font-weight:700}
.upd .ud{font-size:11px;color:var(--ink-dim);font-weight:600;margin-top:1px}
.upd .us{font-size:10px;color:var(--ink-faint);font-weight:600}
.blockers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.blockers li{display:flex;gap:7px;font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.45}
.blockers li::before{content:"";width:5px;height:5px;border-radius:99px;background:var(--warn);flex:none;margin-top:6px}

/* ==================== DOCTOR HOME (priority 3) ==================== */
.dh-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:13px}
@media(max-width:1320px){.dh-metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:780px){.dh-metrics{grid-template-columns:repeat(2,1fr)}}
.dh{display:flex;gap:12px;align-items:flex-start}
.dh-col{width:284px;flex:none;display:flex;flex-direction:column;gap:11px}
.dh-mid{flex:1;min-width:0}
@media(max-width:1400px){.dh{flex-wrap:wrap}.dh-col{width:calc(50% - 6px)}.dh-mid{order:-1;width:100%;flex-basis:100%}}
@media(max-width:820px){.dh-col{width:100%}}
/* patient row — identity, status block, next action, counts */
.prow{
  display:grid;grid-template-columns:auto 1.05fr 1.15fr 1.1fr auto auto;gap:11px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--border);text-align:start;width:100%;transition:background .15s;
}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--surface-2)}
.prow .pn{font-size:14px;font-weight:700;letter-spacing:-.02em}
.prow .pm{font-size:11px;color:var(--ink-dim);font-weight:600;margin-top:1px}
.prow .pdx{font-size:11px;color:var(--ink-2);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:4px}
.miniblk{border:1px solid var(--border);border-radius:10px;padding:7px 9px;background:var(--surface-2)}
.miniblk .mt{font-size:12px;font-weight:700;margin-top:3px;line-height:1.3}
.miniblk .md{font-size:10.5px;color:var(--ink-dim);font-weight:600;margin-top:2px}
.cchip{display:flex;align-items:center;justify-content:space-between;gap:7px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:10.5px;font-weight:700;color:var(--ink-dim);background:var(--surface-2)}
.cchip b{font-size:11.5px;color:var(--ink)}
@media(max-width:1500px){.prow{grid-template-columns:auto 1fr 1fr auto}.prow .c-next,.prow .c-kebab{display:none}}
@media(max-width:1100px){.prow{grid-template-columns:auto 1fr auto}.prow .c-status{display:none}}
.alertcard{background:var(--urgent-soft);border:1px solid var(--urgent-line)}
.alertrow{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--urgent-line);text-align:start;width:100%}
.alertrow:last-of-type{border-bottom:none}
.alertrow .at{font-size:12.5px;font-weight:700}
.alertrow .ad{font-size:11px;color:var(--ink-dim);font-weight:600;margin-top:1px}
.alertrow .dotr{width:7px;height:7px;border-radius:99px;background:var(--urgent);flex:none;margin-top:5px;margin-inline-start:auto}
/* shift schedule — dotted spine with times on the leading edge */
.sched{position:relative;padding-inline-start:4px}
.sched-i{display:flex;gap:10px;align-items:stretch;padding-bottom:9px;position:relative}
.sched-i:last-child{padding-bottom:0}
.sched-t{font-size:11px;font-weight:800;color:var(--accent);width:38px;flex:none;padding-top:9px;font-family:"JetBrains Mono",monospace}
.sched-spine{width:11px;flex:none;position:relative;display:flex;justify-content:center}
.sched-spine::before{content:"";position:absolute;top:12px;bottom:-9px;width:0;border-inline-start:1.5px dashed var(--accent-line)}
.sched-i:last-child .sched-spine::before{display:none}
.sched-spine i{width:7px;height:7px;border-radius:99px;background:var(--accent-line);margin-top:11px;z-index:1}
.sched-i.now .sched-spine i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sched-c{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:7px 10px}
.sched-i.now .sched-c{background:var(--accent-soft);border-color:var(--accent-line)}
.sched-c .st{font-size:12px;font-weight:700;color:var(--accent)}
.sched-c .ss{font-size:10.5px;color:var(--ink-dim);font-weight:600;margin-top:1px}
.tasklet{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.tasklet:last-child{border-bottom:none}
.tasklet .tt{font-size:12.5px;font-weight:700;line-height:1.3}
.tasklet .tm{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-top:1px}
.tasklet .ttime{font-size:11px;font-weight:800;color:var(--ink-dim);flex:none;font-family:"JetBrains Mono",monospace}
.tick{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border-2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .16s}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--stable);border-color:var(--stable);color:#fff}
.orow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.orow:last-child{border-bottom:none}
.orow .oi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--cc) var(--cc-tint),var(--surface));color:var(--cc)}
.orow .on{font-size:16px;font-weight:800;letter-spacing:-.03em}
.orow .ol{font-size:12px;font-weight:700}
.orow .os{font-size:10.5px;color:var(--ink-faint);font-weight:600}

/* ==================== SHARED SECONDARY ==================== */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;align-items:start}
@media(max-width:1000px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:9px;min-height:110px;display:flex;flex-direction:column;gap:7px;transition:all .18s}
.kcol.over{background:var(--accent-soft);border-color:var(--accent)}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 5px;font-size:12px;font-weight:800}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px;cursor:grab;box-shadow:var(--shadow-sm);transition:box-shadow .16s}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.drag{opacity:.3;transform:rotate(-2deg)}
.kcard .t{font-weight:700;font-size:12.5px;margin-bottom:3px}
.kcard .m{font-size:11px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:6px;font-weight:600}
.wardmap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.room{border:1px solid var(--border);border-radius:13px;padding:12px;background:var(--surface);position:relative;text-align:start;box-shadow:var(--shadow-sm);transition:transform .16s,box-shadow .16s}

.switch{width:38px;height:22px;border-radius:99px;background:var(--border-2);position:relative;flex:none;transition:background .2s}

/* ==================== RESPONSE (§1) ====================
   Feedback belongs on the press, not the release. Every surface a finger can
   land on acknowledges it immediately; large surfaces move less than small
   controls so the room reads calm rather than springy. */
.rail-item:active,.pcard:active,.prow:active,.room:active,.kcard:active,
.cat-head:active,.cat-foot:active,.alertrow:active,.sched-i:active{transform:scale(.99)}
.iconbtn:active,.chip:active,.seg button:active,.subtab:active,
.lg-role:active,.linkbtn:active,.switch:active,.cat-item:active,.tl-ev:active{transform:scale(.965)}
.titem:active{transform:scale(.99)}
.tick:active{transform:scale(.92)}
.rail-item,.pcard,.prow,.room,.kcard,.cat-head,.cat-foot,.alertrow,.sched-i,
.iconbtn,.chip,.seg button,.subtab,.lg-role,.linkbtn,.switch,.cat-item,.tl-ev,.tick{
  transition:transform var(--t-press) var(--ease),background .15s var(--ease),
             border-color .15s var(--ease),box-shadow .18s var(--ease),color .15s var(--ease);
}
/* §10 small controls get invisible hit padding so the target is comfortable */
.tick,.titem .add{position:relative}
.tick::after,.titem .add::after{content:"";position:absolute;inset:-9px}

/* ==================== TYPOGRAPHY (§15) ====================
   Tracking is keyed to size: tighten as type grows, ease open as it shrinks.
   A single letter-spacing would be wrong at one end or the other. */
body{letter-spacing:var(--track-body)}
h1,h2,h3,h4{letter-spacing:var(--track-title)}
.lg-name,.hub-txt .n,.metric .num,.orow .on{letter-spacing:var(--track-display)}
.hint,.pm,.md,.os,.us,.tm,.ss,.cat-openN,.cat-empty,.rm,.stt,
.tl-dc .dn,.tl-hr,.upd .ud,.upd .us,.lg-foot,.brand-sub,.me .nm span{
  letter-spacing:var(--track-small);
}

/* ==================== ACCESSIBILITY (§14) ====================
   Reduced motion is a gentler equivalent, not the absence of feedback: the
   transforms and springs go, the opacity cross-fades stay. */
@media (prefers-reduced-motion:reduce){
  *{transition-property:opacity,background-color,border-color,color !important;
    transition-duration:180ms !important;transition-timing-function:ease !important}
  .lg-glow,.lg-nodes i,.lg-mark{animation:none !important}
  .catcard.dropok,.catcard.flash{animation:none !important}
  .lg-inner,.lg-f,.msg{animation:none !important}
  .modal{animation:fade .18s ease both !important}
  .toast{animation:fade .18s ease both !important}
  .rail-item:active,.pcard:active,.prow:active,.room:active,.kcard:active,
  .cat-head:active,.cat-foot:active,.alertrow:active,.sched-i:active,
  .iconbtn:active,.chip:active,.seg button:active,.subtab:active,.lg-role:active,
  .linkbtn:active,.switch:active,.cat-item:active,.tl-ev:active,.titem:active,
  .tick:active,.btn:active,.lg-btn:active{transform:none}
  .catcard:hover,.titem:hover,.room:hover,.lg-btn:hover,.lg-role:hover{transform:none}
}
/* Translucency off: frostier means solid, and the blur goes with it. */
@media (prefers-reduced-transparency:reduce){
  .lg-card{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tl-head{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tl-allday{background:var(--surface-2);-webkit-backdrop-filter:none;backdrop-filter:none}

  .lg-glow,.lg-nodes,.lg-grid{display:none}
}

@media (prefers-contrast:more){
  :root{--border:#B9AE97;--border-2:#8E836C;--ink-dim:#4A5568;--ink-faint:#6B7280}

  .lg-card,.tl-head{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  .cat-item .stt,.hint{color:var(--ink-2)}
  .lg-glow,.lg-nodes{opacity:.25}
}

const WEEK_LABEL=(()=>{

    : `${a.getDate()} ב${MONTHS[a.getMonth()]} – ${b.getDate()} ב${mo}`;
  const wk=Math.ceil(((WEEK[0]-new Date(WEEK[0].getFullYear(),0,1))/86400000+1)/7);

})();

})();

    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="${id}"><circle cx="50" cy="50" r="50"/></clipPath>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="hsl(${h} 52% 95%)"/><stop offset="1" stop-color="hsl(${h} 44% 86%)"/>
      </linearGradient></defs>
      <g clip-path="url(#${id})">
        <rect width="100" height="100" fill="url(#g${id})"/>
        <path d="M50 60c-20 0-32 13-34 29a3 3 0 0 0 3 3h62a3 3 0 0 0 3-3c-2-16-14-29-34-29Z" fill="hsl(${h} 40% 52%)"/>
        <path d="M41 52h18v10c0 4-4 7-9 7s-9-3-9-7V52Z" fill="hsl(${h} 30% 74%)"/>
        <circle cx="50" cy="41" r="17.5" fill="hsl(${h} 32% 78%)"/>

      </g>
    </svg>
    ${ring&&rc?`<span class="pt-ring" style="border-color:${rc}"></span>`:''}

}

function bindLogin(){
  const A=document.getElementById('app');
  A.querySelectorAll('[data-lgrole]').forEach(b=>b.addEventListener('click',()=>{
    state.loginRole=b.dataset.lgrole; render();
  }));
  const enter=()=>{
    const root=document.getElementById('lgRoot');
    const go=()=>{
      state.authed=true;
      state.role=state.loginRole;
      state.view=NAV[state.role].items[0][0];
      try{location.hash='#/app'}catch(_){}
      render();
      toast('ברוך הבא ל-RoboTask · '+NAV[state.role].label,'check2');
    };
    if(root){root.classList.add('lg-out'); setTimeout(go,300)} else go();
  };
  A.querySelector('#lgForm')?.addEventListener('submit',e=>{e.preventDefault();enter()});
  A.querySelector('#lgDemo')?.addEventListener('click',enter);
}
function logout(){
  state.authed=false;
  try{location.hash='#/login'}catch(_){}
  render();
}
function repaint(){document.getElementById('body').innerHTML=viewHtml();bind();afterPaint()}
function afterPaint(){
  if(state.view==='canvas') requestAnimationFrame(()=>{drawConnectors();observeCanvas()});
  if(state.view==='timeline') requestAnimationFrame(drawDeps);
}
function toast(msg,icon='check2'){
  const r=document.getElementById('toast-root');
  r.innerHTML=`<div class="toast-wrap"><div class="toast">${ic(icon,16)}<span>${esc(msg)}</span></div></div>`;
  clearTimeout(window.__t); window.__t=setTimeout(()=>r.innerHTML='',3000);
}

/* curved connectors, one per category, in the category's own colour */
let __ro=null;
function observeCanvas(){
  const el=document.getElementById('mindmap'); if(!el)return;
  if(__ro)__ro.disconnect();
  __ro=new ResizeObserver(()=>drawConnectors());
  __ro.observe(el); el.querySelectorAll('.catcard').forEach(c=>__ro.observe(c));
}
function drawConnectors(){
  const wrap=document.getElementById('mindmap'),svg=document.getElementById('mmSvg'),hubEl=document.getElementById('hubEl');
  if(!wrap||!svg||!hubEl)return;
  const wr=wrap.getBoundingClientRect();
  if(wr.width<680){svg.innerHTML='';return}
  svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);
  const hr=hubEl.getBoundingClientRect();
  const hx=hr.left-wr.left+hr.width/2, hy=hr.top-wr.top+hr.height/2, R=hr.width/2+4;
  let out='';
  wrap.querySelectorAll('.catcard').forEach(card=>{
    const cr=card.getBoundingClientRect();
    const cx=cr.left-wr.left+cr.width/2, cy=cr.top-wr.top+cr.height/2;
    const dx=cx-hx, dy=cy-hy, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    const sx=hx+ux*R, sy=hy+uy*R;
    const e=edgePoint(cr.width/2+3,cr.height/2+3,-ux,-uy);
    const ex=cx+e.x, ey=cy+e.y;
    /* pull the control points sideways so the line reads as an organic curve */
    const mx=(sx+ex)/2, my=(sy+ey)/2, nx=-uy, ny=ux, bow=Math.min(len*.22,54);
    const c1x=sx+(mx-sx)*.5+nx*bow*.5, c1y=sy+(my-sy)*.5+ny*bow*.5;
    const c2x=ex-(ex-mx)*.5+nx*bow*.5, c2y=ey-(ey-my)*.5+ny*bow*.5;
    const col=CATS[card.dataset.cat].c;
    const hot=state.drag&&card.dataset.cat===state.drag.cat;
    out+=`<path class="${hot?'hot':''}" stroke="${col}" d="M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${ex} ${ey}"/>`;
  });
  svg.innerHTML=out;
}
function edgePoint(hw,hh,ux,uy){
  const tx=ux!==0?hw/Math.abs(ux):Infinity, ty=uy!==0?hh/Math.abs(uy):Infinity;
  const t=Math.min(tx,ty); return {x:ux*t,y:uy*t};
}

const ROW_H=40;
const EV_MIN_PX=38;
/* lanes must reserve the space a block actually paints, or short
   back-to-back events overlap instead of sitting side by side */
const EV_MIN_MIN=EV_MIN_PX/ROW_H*60;
function layoutDay(items){
  const evs=[...items].sort((a,b)=>toMin(a.time)-toMin(b.time)||a.dur-b.dur)
    .map(i=>({i,s:toMin(i.time),e:toMin(i.time)+Math.max(i.dur,EV_MIN_MIN)}));
  const out=[]; let cl=[], clEnd=-1;
  const flush=()=>{
    if(!cl.length)return;
    const lanes=[];
    cl.forEach(ev=>{let li=lanes.findIndex(l=>l<=ev.s);
      if(li<0){li=lanes.length;lanes.push(ev.e)}else lanes[li]=ev.e; ev.lane=li});
    cl.forEach(ev=>out.push({...ev,lanes:lanes.length})); cl=[]; clEnd=-1;
  };
  evs.forEach(ev=>{if(cl.length&&ev.s>=clEnd)flush(); cl.push(ev); clEnd=Math.max(clEnd,ev.e)});
  flush(); return out;
}

const crossDay=i=>{if(!i.dep)return false;const s=DATA.items.find(x=>x.id===i.dep);return !!s&&s.d!==i.d};
function evBlock(ev){
  const i=ev.i, c=CATS[i.cat];
  const top=ev.s/60*ROW_H, h=Math.max(EV_MIN_PX,(ev.e-ev.s)/60*ROW_H);
  const n=ev.lanes||1, w=100/n, off=ev.lane*w;
  return `<button class="tl-ev ${state.tlSel===i.id?'sel':''} ${isBlocked(i)?'blocked':''}"
    data-openitem="${i.id}" data-ev="${i.id}"
    style="top:${top}px;height:${h}px;inset-inline-start:calc(${off}% + 3px);width:calc(${w}% - 6px);--cc:${c.c};opacity:${i.st==='done'?.72:1}">
    <span class="eh"><span class="etm">${i.time}</span>${crossDay(i)?`<span class="edep" title="תלוי בפריט מיום אחר">${ic('chevR',10)}</span>`:''}<span class="eic">${ic(c.icon,11)}</span></span>
    <span class="et">${esc(i.t)}</span>
  </button>`;
}
function buildChain(items){
  const heads=items.filter(i=>!i.dep&&items.some(x=>x.dep===i.id));
  let best=[];
  heads.forEach(h=>{const ch=[h];let cur=h;
    while(true){const nx=items.find(x=>x.dep===cur.id);if(!nx)break;ch.push(nx);cur=nx}
    if(ch.length>best.length)best=ch});
  return best.length>1?best.slice(0,4):[];
}
function drawDeps(){
  const grid=document.getElementById('tlGrid'),svg=document.getElementById('depSvg');
  if(!grid||!svg)return;
  const gr=grid.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${gr.width} ${gr.height}`);
  const pos=id=>{const el=grid.querySelector(`[data-ev="${id}"]`);if(!el)return null;
    const r=el.getBoundingClientRect();
    return {x:r.left-gr.left+r.width/2,t:r.top-gr.top,b:r.top-gr.top+r.height,l:r.left-gr.left,r:r.left-gr.left+r.width}};
  let out='<defs>';
  const seen=new Set();
  itemsOf(state.pid).forEach(i=>{if(i.dep&&!seen.has(i.cat)){seen.add(i.cat);
    out+=`<marker id="ah${i.cat}" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="${CATS[i.cat].c}" stroke-width="1.4" stroke-linecap="round"/></marker>`}});
  out+='</defs>';
  const items=itemsOf(state.pid);
  items.forEach(i=>{
    if(!i.dep)return;
    const src=items.find(x=>x.id===i.dep);
    /* Only link within a day. A cross-day dependency drawn as a line would
       sweep across the whole week and take the calendar over; those carry a
       small inbound glyph on the event instead, and the full order is spelled
       out in the "critical dependencies" panel. */
    if(!src||src.d!==i.d)return;
    const a=pos(i.dep), b=pos(i.id); if(!a||!b)return;
    const col=CATS[i.cat].c, mid=(a.b+b.t)/2;
    out+=`<path stroke="${col}" marker-end="url(#ah${i.cat})"
      d="M ${a.x} ${a.b} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.t-5}"/>`;
  });
  svg.innerHTML=out;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function bind(){
  const A=document.getElementById('app');
  const on=(s,e,f)=>A.querySelectorAll(s).forEach(el=>el.addEventListener(e,f));

  A.querySelector('#roleSel')?.addEventListener('change',e=>{
    state.role=e.target.value; state.view=NAV[state.role].items[0][0]; render();
  });
  on('[data-theme]','click',e=>{state.theme=e.currentTarget.dataset.theme;render()});
  on('[data-nav]','click',e=>{state.view=e.currentTarget.dataset.nav;render()});
  on('[data-open]','click',e=>{state.pid=e.currentTarget.dataset.open;state.view='canvas';render()});
  A.querySelector('#railOut')?.addEventListener('click',logout);
  A.querySelector('#bellBtn')?.addEventListener('click',()=>toast('3 התראות: תוצאת CT ממתינה, ייעוץ קרדיולוגיה פתוח, סקירת שחרור','bell'));
  A.querySelector('[data-newaction]')?.addEventListener('click',()=>{
    state.view='canvas'; state.tbCollapsed=false; render();
    toast('בחרו פעולה מארגז הכלים וגררו אותה אל הקטגוריה המתאימה','hand');
  });

  ['#topSearch','#topSearch2'].forEach(sel=>{
    const el=A.querySelector(sel); if(!el)return;
    el.addEventListener('input',ev=>{state.search=ev.target.value;repaint();
      const n=document.querySelector(sel)||document.querySelector('#topSearch');
      if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
  });
  const pl=A.querySelector('#plSearch');
  if(pl){pl.addEventListener('input',e=>{state.plQuery=e.target.value;repaint();
    const n=document.getElementById('plSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}})}
  const tq=A.querySelector('#tbxSearch');
  if(tq){tq.addEventListener('input',e=>{state.tbQuery=e.target.value;repaint();
    const n=document.getElementById('tbxSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}})}

  on('[data-toggle-cat]','click',e=>{const k=e.currentTarget.dataset.toggleCat;state.open[k]=!state.open[k];repaint()});
  on('[data-catall]','click',e=>{
    const k=e.currentTarget.dataset.catall;
    if(k==='strategy'){state.open.strategy=true;repaint();toast('אסטרטגיית הטיפול נפתחה')}
    else{state.view='table';state.search='';render();toast(`מציג את כל פריטי ${CATS[k].label}`)}
  });
  A.querySelector('#tbxToggle')?.addEventListener('click',()=>{state.tbCollapsed=!state.tbCollapsed;repaint()});
  on('[data-tbcat]','click',e=>{const k=e.currentTarget.dataset.tbcat;state.tbOpen[k]=!state.tbOpen[k];repaint()});
  on('[data-add]','click',e=>{e.stopPropagation();
    openSchedule(e.currentTarget.dataset.add,e.currentTarget.dataset.addcat,e.currentTarget.dataset.addcat,false)});

  /* toolbox → category drag */
  on('.titem','dragstart',e=>{
    const el=e.currentTarget;
    state.drag={t:el.dataset.tool,cat:el.dataset.toolcat};
    e.dataTransfer.effectAllowed='copy';
    e.dataTransfer.setData('text/plain',JSON.stringify(state.drag));
    el.classList.add('drag');
    document.getElementById('mindmap')?.classList.add('dragging');
    paintTargets();
  });
  on('.titem','dragend',e=>{e.currentTarget.classList.remove('drag');state.drag=null;clearTargets()});
  /* dragenter must also be cancelled or the card never becomes a real drop
     target, and the highlight would wait on a dragover tick that may not come */
  const markTarget=e=>{
    if(!state.drag)return false;
    e.preventDefault();
    const ok=e.currentTarget.dataset.cat===state.drag.cat;
    if(e.dataTransfer) e.dataTransfer.dropEffect=ok?'copy':'move';
    document.querySelectorAll('.catcard.dropover').forEach(c=>{if(c!==e.currentTarget)c.classList.remove('dropover')});
    e.currentTarget.classList.toggle('dropover',ok);
    return true;
  };
  on('.catcard','dragenter',markTarget);
  on('.catcard','dragover',markTarget);
  on('.catcard','dragleave',e=>{
    /* dragleave also fires when the cursor crosses onto a child of the card,
       so only drop the highlight once it has genuinely left the card */
    const to=e.relatedTarget;
    if(to&&e.currentTarget.contains(to))return;
    e.currentTarget.classList.remove('dropover');
  });
  on('.catcard','drop',e=>{
    e.preventDefault(); if(!state.drag)return;
    const dropped=e.currentTarget.dataset.cat, correct=state.drag.cat, title=state.drag.t;
    e.currentTarget.classList.remove('dropover');
    state.drag=null; clearTargets();
    openSchedule(title,correct,dropped,dropped!==correct);
  });

  on('[data-openitem]','click',e=>{e.stopPropagation();openItem(e.currentTarget.dataset.openitem)});
  on('[data-toggle]','click',e=>{e.stopPropagation();
    const i=DATA.items.find(x=>x.id===e.currentTarget.dataset.toggle);
    i.st=i.st==='done'?'warn':'done';
    toast(i.st==='done'?`״${i.t}״ סומן כבוצע — עודכן בכל המסכים`:`״${i.t}״ הוחזר לפתוח`);
    render();
  });

  on('[data-range]','click',e=>{state.tlRange=e.currentTarget.dataset.range;repaint()});
  const sc=A.querySelector('#tlScroll'); if(sc) sc.scrollTop=5*ROW_H;

  on('[data-kitem]','dragstart',e=>{e.dataTransfer.setData('k',e.currentTarget.dataset.kitem);e.currentTarget.classList.add('drag')});
  on('[data-kitem]','dragend',e=>e.currentTarget.classList.remove('drag'));
  on('[data-drop]','dragover',e=>{e.preventDefault();e.currentTarget.classList.add('over')});
  on('[data-drop]','dragleave',e=>e.currentTarget.classList.remove('over'));
  on('[data-drop]','drop',e=>{e.preventDefault();e.currentTarget.classList.remove('over');
    const it=DATA.items.find(x=>x.id===e.dataTransfer.getData('k'));
    if(it){it.st=e.currentTarget.dataset.drop;toast(`״${it.t}״ עודכן ל־${STATUS[it.st]}`);render()}});
  on('[data-hitem]','dragstart',e=>{e.dataTransfer.setData('h',e.currentTarget.dataset.hitem);e.currentTarget.classList.add('drag')});
  on('[data-hitem]','dragend',e=>e.currentTarget.classList.remove('drag'));
  on('[data-hdrop]','dragover',e=>{e.preventDefault();e.currentTarget.classList.add('over')});
  on('[data-hdrop]','dragleave',e=>e.currentTarget.classList.remove('over'));
  on('[data-hdrop]','drop',e=>{e.preventDefault();e.currentTarget.classList.remove('over');
    const id=e.dataTransfer.getData('h');let f=null;
    for(const k of Object.keys(DATA.handoff)){const ix=DATA.handoff[k].findIndex(x=>x.id===id);
      if(ix>-1){f=DATA.handoff[k].splice(ix,1)[0];break}}
    if(f){DATA.handoff[e.currentTarget.dataset.hdrop].push(f);toast('הפריט הועבר במסירת המשמרת');render()}});
  A.querySelector('#confirmHandoff')?.addEventListener('click',()=>toast('מסירת המשמרת אושרה ותועדה'));

  on('[data-auto]','click',e=>{const a=DATA.automations.find(x=>x.id===e.currentTarget.dataset.auto);
    a.on=!a.on;toast(a.on?`״${a.name}״ הופעלה`:`״${a.name}״ הושבתה`);render()});
  A.querySelector('#aCreate')?.addEventListener('click',()=>{
    const n=A.querySelector('#aName').value.trim()||'אוטומציה חדשה';
    DATA.automations.unshift({id:uid(),name:n,trigger:A.querySelector('#aTrig').value,action:A.querySelector('#aAct').value,on:true});
    toast(`האוטומציה ״${n}״ נוצרה והופעלה`);render();
  });
  A.querySelector('#famQ')?.addEventListener('click',()=>toast('השאלה נשלחה לצוות המטפל'));
  A.querySelector('#famUpd')?.addEventListener('click',()=>{
    (DATA.familyMsgs.p1=DATA.familyMsgs.p1||[]).push({time:nowHM(),text:'הצוות עדכן: המטופל יציב, ממתינים לתוצאות ההדמיה.'});
    toast('התקבל עדכון חדש מהצוות');render()});
  A.querySelector('#extSend')?.addEventListener('click',()=>{
    const v=A.querySelector('#extOp'); if(!v.value.trim()){toast('נא להזין חוות דעת','alert');return}
    DATA.items.push({id:uid(),p:'p1',cat:'consults',t:'חוות דעת יועץ ריאות',st:'done',pr:'normal',
      who:'יועץ חיצוני',d:TODAY,time:nowHM(),dur:30,dep:null,note:v.value.trim()});
    v.value='';toast('חוות הדעת נשלחה ונוספה לתיק המטופל');render()});
  A.querySelector('#aiSend')?.addEventListener('click',sendAI);
  A.querySelector('#aiIn')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendAI()});
  const cl=A.querySelector('#chatlog'); if(cl) cl.scrollTop=cl.scrollHeight;

  window.onresize=()=>{if(state.view==='canvas')drawConnectors();if(state.view==='timeline')drawDeps()};
}
function paintTargets(){
  document.querySelectorAll('.catcard').forEach(c=>{
    c.classList.remove('dropok','dimmed');
    if(!state.drag)return;
    c.classList.add(c.dataset.cat===state.drag.cat?'dropok':'dimmed');
  });
  drawConnectors();
}
function clearTargets(){
  document.querySelectorAll('.catcard').forEach(c=>c.classList.remove('dropok','dimmed','dropover'));
  document.getElementById('mindmap')?.classList.remove('dragging');
  drawConnectors();
}

   MODALS
   ===================================================================== */
function closeModal(){document.getElementById('modal-root').innerHTML=''}
/* §7 spatial consistency: a sheet should emerge from what opened it, so the
   panel scales out of the last thing the user touched rather than the middle
   of the screen. Tracked passively on the document so no call site changes. */
let __origin={x:.5,y:.45};
document.addEventListener('pointerdown',e=>{
  if(!e.clientX&&!e.clientY)return;
  __origin={x:Math.min(1,Math.max(0,e.clientX/innerWidth)),
            y:Math.min(1,Math.max(0,e.clientY/innerHeight))};
},true);

function modalShell(title,icon,body,col){
  const org=`${(__origin.x*100).toFixed(1)}% ${(__origin.y*100).toFixed(1)}%`;
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-back" id="mback"><div class="modal" style="--cc:${col||'var(--accent)'};transform-origin:${org}">
    <div class="modal-head"><span style="color:var(--cc)">${ic(icon,18)}</span><h3>${esc(title)}</h3>
      <button class="iconbtn" id="mclose" style="margin-inline-start:auto;width:30px;height:30px">${ic('x',14)}</button></div>
    <div class="modal-body">${body}</div>
  </div></div>`;
  document.getElementById('mback').addEventListener('click',e=>{if(e.target.id==='mback')closeModal()});
  document.getElementById('mclose').addEventListener('click',closeModal);
  const esckey=e=>{if(e.key==='Escape'){closeModal();document.removeEventListener('keydown',esckey)}};
  document.addEventListener('keydown',esckey);
  document.querySelector('.modal input,.modal select,.modal textarea')?.focus();
}
function openSchedule(title,cat,droppedOn,routed){
  const p=P_(state.pid), c=CATS[cat];
  const deps=itemsOf(p.id).filter(i=>i.st!=='done');
  modalShell('הוספת פעולה קלינית',c.icon,`
    ${routed?`<div class="pill warn" style="margin-bottom:11px;display:flex"><span class="dot"></span>
      שוחרר על ״${CATS[droppedOn].label}״ — נותב אוטומטית ל״${c.label}״ לפי סוג הפעולה</div>`:''}
    <div class="row" style="gap:10px;padding:10px 11px;background:color-mix(in srgb,${c.c} var(--cc-tint),var(--surface));
         border:1px solid color-mix(in srgb,${c.c} 30%,var(--border));border-radius:11px;margin-bottom:14px">
      <span style="width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
        background:var(--surface);color:${c.c};flex:none">${ic(c.icon,16)}</span>
      <div><div style="font-weight:800;font-size:14px">${esc(title)}</div>
        <div class="hint" style="font-size:11px">${c.label} · ${esc(p.name)} · חדר ${p.room}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 11px">
      <div class="field"><label>תאריך</label><select id="fDay">
        ${DAYS.map((d,i)=>`<option value="${i}" ${i===TODAY?'selected':''}>${DAY_LABEL(i)} · ${DATES[i]}</option>`).join('')}</select></div>
      <div class="field"><label>שעה</label><input id="fTime" type="time" value="${nowHM()}"></div>
      <div class="field"><label>דחיפות</label><select id="fPr">
        ${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k==='normal'?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>אחראי</label><select id="fWho">
        <option>ד״ר כהן</option><option>ד״ר גולן</option><option>ד״ר לוי</option><option>אחות דנה</option>
        <option>אחות מיכל</option><option>מעבדה</option><option>עו״ס רונית</option><option>פיזיותרפיה</option></select></div>
    </div>
    <div class="field"><label>תלות (יתחיל רק לאחר)</label><select id="fDep">
      <option value="">ללא תלות</option>
      ${deps.map(i=>`<option value="${i.id}">${esc(i.t)} · ${i.time}</option>`).join('')}</select></div>
    <div class="field"><label>הערות קליניות</label><textarea id="fNote" placeholder="הערה לצוות…"></textarea></div>
    <button class="btn primary block" id="fSave">${ic('plus',15)} הוסף לקנבס המטופל</button>
    <p class="hint" style="margin:9px 0 0;text-align:center;font-size:11px">
      הפעולה תופיע מיד בקנבס, בציר הזמן, במשימות, בטבלה ובדשבורד המנהל</p>
  `,c.c);
  document.getElementById('fSave').addEventListener('click',()=>{
    const pr=document.getElementById('fPr').value;
    DATA.items.push({id:uid(),p:state.pid,cat,t:title,
      st:pr==='urgent'?'urgent':'warn',pr,
      who:document.getElementById('fWho').value,
      d:+document.getElementById('fDay').value,
      time:document.getElementById('fTime').value||nowHM(),
      dur:30,dep:document.getElementById('fDep').value||null,
      note:document.getElementById('fNote').value.trim()});
    state.open[cat]=true; closeModal(); render();
    const card=document.querySelector(`.catcard[data-cat="${cat}"]`);
    if(card){card.classList.add('flash');card.scrollIntoView({block:'nearest',behavior:'smooth'})}
    toast(`״${title}״ נוסף ל${CATS[cat].label} — מסונכרן בכל המסכים`);
  });
}
function openItem(id){
  const i=DATA.items.find(x=>x.id===id); if(!i)return;
  const p=P_(i.p), c=CATS[i.cat], dep=i.dep?DATA.items.find(x=>x.id===i.dep):null;
  modalShell(i.t,c.icon,`
    <div class="row" style="gap:7px;margin-bottom:13px;flex-wrap:wrap">
      <span class="pill" style="background:color-mix(in srgb,${c.c} var(--cc-tint),var(--surface));color:${c.c};border-color:color-mix(in srgb,${c.c} 34%,var(--border))">${ic(c.icon,12)} ${c.label}</span>
      ${pillFor(i.st)}<span class="pill ${i.pr==='urgent'?'urgent':i.pr==='high'?'warn':'ghost'}">דחיפות ${PRIORITY[i.pr]}</span>
      ${isBlocked(i)?'<span class="pill warn"><span class="dot"></span>חסום בהמתנה לתלות</span>':''}
    </div>
    <div class="kv"><span class="k">מטופל</span><b>${esc(p.name)} · חדר ${p.room}</b></div>
    <div class="kv"><span class="k">אחראי</span><b>${esc(i.who)}</b></div>
    <div class="kv"><span class="k">מועד</span><b class="mono">${DAYS[i.d]||''} ${DATES[i.d]||''} · ${i.time}</b></div>
    <div class="kv"><span class="k">משך משוער</span><b class="mono">${i.dur} דק׳</b></div>
    <div class="kv"><span class="k">תלוי ב־</span><b>${dep?esc(dep.t):'—'}</b></div>
    <div class="kv"><span class="k">הערות</span><b style="font-weight:600;color:var(--ink-2);text-align:end;max-width:58%">${esc(i.note)||'—'}</b></div>
    <div class="field" style="margin-top:14px"><label>עדכון סטטוס</label>
      <select id="iSt">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${i.st===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="row" style="gap:8px">
      <button class="btn primary" id="iSave" style="flex:1">${ic('check2',15)} שמור עדכון</button>
      <button class="btn" id="iTl">${ic('calendar',15)} הצג בציר הזמן</button>
    </div>`,c.c);
  document.getElementById('iSave').addEventListener('click',()=>{
    i.st=document.getElementById('iSt').value; closeModal(); render();
    toast(`״${i.t}״ עודכן ל־${STATUS[i.st]} — מסונכרן בכל המסכים`);
  });
  document.getElementById('iTl').addEventListener('click',()=>{
    closeModal(); state.pid=i.p; state.tlSel=i.id; state.view='timeline'; render();
  });
}

/* =====================================================================
   AI (mock, reads the same shared state)
   ===================================================================== */
function sendAI(){
  const el=document.getElementById('aiIn'); const t=el.value.trim(); if(!t)return;
  state.chat.push({from:'user',text:t});
  const p=P_(state.pid); let r;
  if(/חוסם|חסם|מעכב|שחרור/.test(t)){
    r=p.blockers.length?`מה שמעכב שחרור עבור ${p.name}: ${p.blockers.join('; ')}. הערכת המערכת — ${p.ai}`
                       :`אין חסמים פעילים לשחרור עבור ${p.name}. ${p.ai}`;
  } else if(/סיכום|מצב/.test(t)){
    const o=openItems(p.id);
    r=`${p.name}, ${p.age}, יום אשפוז ${p.day}. אבחנה: ${p.dx} (${p.dxEn}). יעד הטיפול: ${p.goal} — ${p.progress}%. ${o.length} פריטים פתוחים, מתוכם ${o.filter(i=>i.pr==='urgent').length} דחופים.`;
  } else if(/משימה|צור|הוסף/.test(t)){
    DATA.items.push({id:uid(),p:state.pid,cat:'tasks',t:'משימת מעקב (נוצרה ע״י העוזר)',st:'warn',
      pr:'normal',who:'ד״ר כהן',d:TODAY,time:nowHM(),dur:30,dep:null,note:t});
    r=`נוצרה משימה חדשה עבור ${p.name} ושויכה לקטגוריית משימות. היא מופיעה כעת בקנבס, בציר הזמן ובטבלה.`;
  } else if(/מחלקה|מטופלים/.test(t)){
    const a=DATA.patients.filter(x=>x.status!=='stable');
    r=`במחלקה ${DATA.patients.length} מטופלים. ${a.length} דורשים תשומת לב: ${a.map(x=>x.name+' (חדר '+x.room+')').join('; ')}.`;
  } else {
    r=`בהתבסס על הנתונים הנוכחיים של ${p.name}: ${p.summary}. הפעולה הבאה המומלצת — ${p.nextAct} (${p.nextAt}).`;
  }
  state.chat.push({from:'bot',text:r});
  el.value=''; render();
}

render();
</script>
