<title>RoboTask</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS ============
   Light = warm ivory / sand ground, white cards, clinical blue accent.
   Dark  = deep desaturated navy, refined, same hierarchy.            */
:root{
  --bg:#F3EFE7; --bg-2:#EAE5DA;
  --surface:#FFFFFF; --surface-2:#FAF8F4; --surface-3:#F1EDE5;
  --border:#E3DCCF; --border-2:#D6CDBC; --border-cool:#DFE4EC;
  --ink:#12253F; --ink-2:#374A63; --ink-dim:#66788E; --ink-faint:#95A2B3;
  --accent:#1D5FE0; --accent-2:#0E93AE; --accent-ink:#FFFFFF;
  --accent-soft:#E7EEFD; --accent-line:#BED2F8;
  --urgent:#C93A38; --urgent-soft:#FBE9E7; --urgent-line:#F0C4C0;
  --warn:#B4761A; --warn-soft:#FAF0DC; --warn-line:#EDD6A9;
  --stable:#237F58; --stable-soft:#E3F3EA; --stable-line:#BDE0CC;
  --done:#78879A; --done-soft:#EEF0F3;
  --violet:#6B4FCE; --violet-soft:#EFEBFB;
  --shadow-sm:0 1px 2px rgba(30,26,18,.05);
  --shadow:0 1px 2px rgba(30,26,18,.04), 0 6px 18px -10px rgba(30,26,18,.22);
  --shadow-lg:0 24px 60px -22px rgba(24,32,45,.35), 0 2px 6px rgba(30,26,18,.06);
  --r:16px; --r-sm:11px;
  --hub:#12253F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1219; --bg-2:#0A1016;
  --surface:#141D28; --surface-2:#19232F; --surface-3:#1F2A38;
  --border:#25313F; --border-2:#31404F; --border-cool:#283444;
  --ink:#E9EEF4; --ink-2:#C0CCDA; --ink-dim:#93A2B4; --ink-faint:#6B7A8C;
  --accent:#4E8DFF; --accent-2:#3BB9CE; --accent-ink:#06121F;
  --accent-soft:#132542; --accent-line:#26456F;
  --urgent:#F0736E; --urgent-soft:#2A1616; --urgent-line:#4A2523;
  --warn:#DFA542; --warn-soft:#2A2113; --warn-line:#4A3A1C;
  --stable:#4FBE8B; --stable-soft:#13291F; --stable-line:#23472F;
  --done:#7B8A9C; --done-soft:#1B242F;
  --violet:#9B84F0; --violet-soft:#1D1930;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -12px rgba(0,0,0,.7);
  --shadow-lg:0 26px 64px -22px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.5);
  --hub:#4E8DFF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1219; --bg-2:#0A1016;
  --surface:#141D28; --surface-2:#19232F; --surface-3:#1F2A38;
  --border:#25313F; --border-2:#31404F; --border-cool:#283444;
  --ink:#E9EEF4; --ink-2:#C0CCDA; --ink-dim:#93A2B4; --ink-faint:#6B7A8C;
  --accent:#4E8DFF; --accent-2:#3BB9CE; --accent-ink:#06121F;
  --accent-soft:#132542; --accent-line:#26456F;
  --urgent:#F0736E; --urgent-soft:#2A1616; --urgent-line:#4A2523;
  --warn:#DFA542; --warn-soft:#2A2113; --warn-line:#4A3A1C;
  --stable:#4FBE8B; --stable-soft:#13291F; --stable-line:#23472F;
  --done:#7B8A9C; --done-soft:#1B242F;
  --violet:#9B84F0; --violet-soft:#1D1930;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -12px rgba(0,0,0,.7);
  --shadow-lg:0 26px 64px -22px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.5);
  --hub:#4E8DFF;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); direction:rtl;
  font-family:"Heebo",-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; letter-spacing:-.005em;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.02em; text-wrap:balance}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
::selection{background:var(--accent); color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2); border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
svg{display:block; flex:none}

/* ============ SHELL ============ */
#app{display:flex; min-height:100vh}
.sidebar{
  width:232px; flex:none; height:100vh; position:sticky; top:0; overflow-y:auto;
  background:var(--surface); border-inline-start:1px solid var(--border);
  display:flex; flex-direction:column; padding:16px 12px; gap:14px;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 6px 2px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:var(--shadow);
}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1.1}
.brand-sub{font-size:10px;color:var(--ink-faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}

.role-block{display:flex;flex-direction:column;gap:6px}
.mini-label{font-size:9.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:0 6px}
.role-select{
  appearance:none;width:100%;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(12px) calc(50% - 2px),calc(16px) calc(50% - 2px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:9.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:14px 8px 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:start;
  color:var(--ink-dim);font-size:13px;font-weight:600;transition:background .16s,color .16s;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active svg{stroke:var(--accent)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.theme-toggle{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:11px;border:1px solid var(--border)}
.theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px;border-radius:8px;font-size:11px;font-weight:700;color:var(--ink-faint)}
.theme-btn.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  flex:none;display:flex;align-items:center;gap:14px;padding:12px 24px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.topbar h1{font-size:18px}
.shift-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-dim);background:var(--surface-2);border:1px solid var(--border);padding:5px 10px;border-radius:99px}
.searchbox{
  margin-inline-start:auto;display:flex;align-items:center;gap:8px;width:280px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:8px 12px;transition:border-color .16s;
}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--ink);font-size:13px}
.iconbtn{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-dim);transition:color .16s,border-color .16s;position:relative;
}
.iconbtn:hover{color:var(--accent);border-color:var(--accent-line)}
.iconbtn .badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:15px;height:15px;border-radius:99px;background:var(--urgent);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:8px;padding-inline-start:6px;border-inline-start:1px solid var(--border)}
.content{flex:1;overflow-y:auto;padding:20px 24px 64px}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;align-items:center;gap:10px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec-head h2{font-size:15px}
.sec-head .sp{margin-inline-start:auto}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
.pill.urgent{background:var(--urgent-soft);color:var(--urgent);border-color:var(--urgent-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.stable{background:var(--stable-soft);color:var(--stable);border-color:var(--stable-line)}
.pill.done{background:var(--done-soft);color:var(--done);border-color:var(--border)}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.ghost{background:var(--surface-2);color:var(--ink-dim);border-color:var(--border)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;
  transition:transform .12s cubic-bezier(.2,.9,.3,1.2),background .15s,border-color .15s,box-shadow .15s;
}
.btn:hover{border-color:var(--border-2)}
.btn:active{transform:scale(.965)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:8px;font-weight:700}
.btn.block{width:100%}

.avatar{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;position:relative;box-shadow:var(--shadow-sm)}
.avatar .ring{position:absolute;inset:-3px;border-radius:15px;border:2px solid;pointer-events:none}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;color:var(--ink-faint);font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowbtn:hover{background:var(--surface-2);cursor:pointer}

.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-dim);font-weight:600}
.empty{padding:34px 16px;text-align:center;color:var(--ink-faint);font-size:13px}

.stat{padding:15px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat .num{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.stat .lbl{font-size:11.5px;color:var(--ink-dim);font-weight:600}
.stat .ic{position:absolute;top:14px;inset-inline-end:14px;opacity:.5}

.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.2,.8,.2,1)}

.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-dim);transition:all .15s}
.chip:hover{border-color:var(--border-2);color:var(--ink)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-faint);transition:all .15s}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ============ MODALS / TOAST ============ */
.modal-back{position:fixed;inset:0;background:rgba(16,22,30,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;animation:fade .18s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15.5px}
.modal-body{padding:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-dim)}
.field input,.field select,.field textarea{
  padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:13.5px;outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px}
.toast-wrap{position:fixed;bottom:24px;inset-inline:0;display:flex;justify-content:center;z-index:300;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);animation:toastin .3s cubic-bezier(.2,.9,.3,1.2);max-width:min(560px,90vw)}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}

/* ============ PATIENT CANVAS ============ */
.canvas-layout{display:flex;gap:16px;align-items:flex-start}
.canvas-main{flex:1;min-width:0}

.phead{
  display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
}
.phead .name{font-size:19px;font-weight:800;letter-spacing:-.03em}
.phead .facts{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:3px;font-size:12px;color:var(--ink-dim);font-weight:600}
.phead .facts span{display:inline-flex;align-items:center;gap:5px}
.phead-divider{width:1px;align-self:stretch;background:var(--border);margin:2px 0}
.phead-meta{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.phead-meta b{font-weight:700}
.allergy{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:99px;background:var(--urgent-soft);color:var(--urgent);border:1px solid var(--urgent-line);font-size:11px;font-weight:700}

#mindmap{position:relative;padding:8px}
#mmSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#mmSvg path{fill:none;stroke:var(--border-2);stroke-width:1.25;opacity:.85}
#mmSvg path.hot{stroke:var(--accent);stroke-width:2;opacity:1}
.mm-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;z-index:1;align-items:start;
}
.mm-hub{
  grid-column:2 / span 2; grid-row:2 / span 2; align-self:stretch;
  display:flex;align-items:center;justify-content:center;padding:6px;min-height:300px;
}
.hub-inner{
  width:100%;max-width:300px;border-radius:24px;padding:20px 18px;text-align:center;position:relative;
  background:linear-gradient(165deg,var(--surface) 0%,var(--surface-2) 100%);
  border:1.5px solid var(--accent-line); box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:box-shadow .3s, border-color .3s, transform .3s cubic-bezier(.2,.9,.3,1.1);
}
.hub-inner::before{
  content:"";position:absolute;inset:-7px;border-radius:31px;border:1px solid var(--accent-line);opacity:.45;pointer-events:none;
}
#mindmap.dragging .hub-inner{transform:scale(1.02);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-lg)}
.hub-portrait{width:76px;height:76px;border-radius:26px;font-size:27px;letter-spacing:-.03em}
.hub-name{font-size:20px;font-weight:800;letter-spacing:-.035em}
.hub-sub{font-size:12.5px;color:var(--ink-dim);font-weight:600}
.hub-summary{font-size:12.5px;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--border);border-radius:11px;padding:8px 11px;line-height:1.45;width:100%}

.catcard{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  transition:border-color .2s,box-shadow .2s,transform .2s cubic-bezier(.2,.9,.3,1.1);
  min-height:64px;
}
.catcard::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--cc);opacity:.9}
.catcard:hover{border-color:var(--border-2);transform:translateY(-1px)}
.cat-head{display:flex;align-items:center;gap:9px;padding:11px 12px 11px 13px;text-align:start;width:100%}
.cat-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--ccs);color:var(--cc)}
.cat-title{font-size:12.5px;font-weight:700;line-height:1.2;flex:1;min-width:0}
.cat-count{font-size:11px;font-weight:800;color:var(--ink-faint);background:var(--surface-3);border-radius:99px;padding:2px 7px;min-width:22px;text-align:center}
.cat-chev{color:var(--ink-faint);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.catcard.open .cat-chev{transform:rotate(180deg)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.9,.3,1)}
.catcard.open .cat-body{grid-template-rows:1fr}
.cat-body-inner{overflow:hidden}
.cat-list{padding:0 12px 11px;display:flex;flex-direction:column;gap:5px}
.cat-item{
  display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--border);font-size:11.5px;font-weight:600;text-align:start;width:100%;transition:background .15s;
}
.cat-item:hover{background:var(--surface-3)}
.cat-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .st{width:14px;height:14px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none;font-size:9px;font-weight:800}
.st.done{background:var(--stable-soft);color:var(--stable)}
.st.progress{background:var(--accent-soft);color:var(--accent)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.urgent{background:var(--urgent-soft);color:var(--urgent)}
.cat-empty{font-size:11px;color:var(--ink-faint);padding:2px 2px 6px}

.catcard.dropok{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);animation:breathe 1.4s ease-in-out infinite}
.catcard.dropover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-lg);transform:translateY(-3px) scale(1.015)}
.catcard.dimmed{opacity:.42}

function render(){
  if(state.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('app').innerHTML=shell();
  bind();
  if(state.view==='canvas') requestAnimationFrame(()=>{drawConnectors();observeCanvas()});
  if(state.view==='timeline') requestAnimationFrame(drawDeps);
}
function repaintContent(){
  document.getElementById('content').innerHTML=viewHtml();
  bind();
  if(state.view==='canvas') requestAnimationFrame(()=>{drawConnectors();observeCanvas()});
  if(state.view==='timeline') requestAnimationFrame(drawDeps);
}
function toast(msg,icon='check'){
  const r=document.getElementById('toast-root');
  r.innerHTML=`<div class="toast-wrap"><div class="toast">${ic(icon,16)}<span>${msg}</span></div></div>`;
  clearTimeout(window.__t); window.__t=setTimeout(()=>r.innerHTML='',3000);
}

   ========================================================================= */
const ROW_H=34; /* px per hour */
/* Google-Calendar style lane packing: cluster overlapping events, then
   give each one a column inside its cluster so nothing hides anything. */
function layoutDay(items){
  const evs=[...items].sort((a,b)=>toMin(a.time)-toMin(b.time)||a.dur-b.dur)
    .map(i=>({i,s:toMin(i.time),e:toMin(i.time)+Math.max(i.dur,25)}));
  const out=[]; let cluster=[], clusterEnd=-1;
  const flush=()=>{
    if(!cluster.length) return;
    const lanes=[];
    cluster.forEach(ev=>{
      let li=lanes.findIndex(l=>l<=ev.s);
      if(li<0){li=lanes.length;lanes.push(ev.e)} else lanes[li]=ev.e;
      ev.lane=li;
    });
    cluster.forEach(ev=>out.push({...ev,lanes:lanes.length}));
    cluster=[]; clusterEnd=-1;
  };
  evs.forEach(ev=>{
    if(cluster.length && ev.s>=clusterEnd) flush();
    cluster.push(ev); clusterEnd=Math.max(clusterEnd,ev.e);
  });
  flush();
  return out;
}
function vTimeline(){
  const p=P_(state.pid);
  const days = state.tlRange==='day'?[TODAY] : state.tlRange==='3'?[TODAY,TODAY+1,TODAY+2] : [0,1,2,3,4,5,6];
  const items=itemsOf(p.id);
  const nowTop=(new Date().getHours()*60+new Date().getMinutes())/60*ROW_H;

  const blockers=items.filter(i=>i.st!=='done'&&(i.cat==='decisions'||i.cat==='documents'||i.cat==='social'||i.pr==='urgent'));
  const recent=items.filter(i=>i.st==='done').slice(-4).reverse();
  const chains=buildChains(items);

  return `
  <div class="tl-layout">
    <div class="card tl-main">
      <div class="tl-bar">
        ${ic('calendar',17)}
        <b style="font-size:14px">${p.name}</b>
        <span class="pill ghost">חדר ${p.room}</span>
        <div class="seg" style="margin-inline-start:auto">
          <button class="${state.tlRange==='day'?'active':''}" data-range="day">יום</button>
          <button class="${state.tlRange==='3'?'active':''}" data-range="3">3 ימים</button>
          <button class="${state.tlRange==='week'?'active':''}" data-range="week">שבוע</button>
        </div>
        <select class="role-select" style="width:auto;min-width:140px" id="pSwitch">
          ${DATA.patients.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}
        </select>
      </div>

      <div class="tl-scroll" id="tlScroll">
        <div class="tl-grid" id="tlGrid" style="min-width:${44+days.length*(state.tlRange==='week'?128:220)}px">
          <div class="tl-headrow" style="grid-template-columns:44px repeat(${days.length},1fr)">
            <div class="tl-corner"></div>
            ${days.map(d=>`<div class="tl-daycell ${d===TODAY?'today':''}">
              <div class="dn">${DAYS[d]}</div><div class="dd mono">${String(20+d).padStart(2,'0')}</div></div>`).join('')}
          </div>
          <div class="tl-body" style="grid-template-columns:44px repeat(${days.length},1fr);height:${24*ROW_H}px">
            <div class="tl-hours">
              ${Array.from({length:13},(_,h)=>`<div class="tl-hour mono" style="top:${h*2*ROW_H}px">${String(h*2).padStart(2,'0')}:00</div>`).join('')}
            </div>
            ${days.map(d=>`<div class="tl-col" data-daycol="${d}">
              ${Array.from({length:24},(_,h)=>`<div class="tl-line ${h%2?'half':''}" style="top:${h*ROW_H}px"></div>`).join('')}
              ${d===TODAY?`<div class="tl-now" style="top:${nowTop}px"></div>`:''}
              ${layoutDay(items.filter(i=>i.d===d)).map(ev=>evBlock(ev)).join('')}
            </div>`).join('')}
          </div>
          <svg id="depSvg"></svg>
        </div>
      </div>
      <div class="legend">
        ${['imaging','tests','meds','treatments','consults','tasks','decisions','family','discharge'].map(k=>
          `<span><i style="background:${CATS[k].c}"></i>${CATS[k].label}</span>`).join('')}
        <span style="margin-inline-start:auto">${ic('link',12)} קו מקווקו = תלות בין פריטים</span>
      </div>
    </div>

    <aside class="tl-side">
      <div class="card pad">
        <div class="sec-head">${ic('alert',16)}<h2>מה חוסם שחרור?</h2></div>
        ${blockers.length?blockers.map(i=>`
          <button class="dep-item" style="width:100%;text-align:start" data-openitem="${i.id}">
            <span class="sched-bar" style="background:${CATS[i.cat].c};min-height:26px"></span>
            <span style="flex:1"><b style="display:block;font-size:12.5px">${i.t}</b>
            <span style="font-size:10.5px;color:var(--ink-faint);font-weight:600">${CATS[i.cat].label} · ${i.who}</span></span>
            ${pillFor(i.st)}
          </button>`).join(''):'<div class="empty">אין חסמים פעילים</div>'}
      </div>

      <div class="card pad">
        <div class="sec-head">${ic('branch',16)}<h2>תלויות קריטיות</h2></div>
        ${chains.length?chains.map(ch=>`<div class="dep-chain" style="margin-bottom:10px">
          ${ch.map((n,i)=>`${i?`<span style="color:var(--ink-faint)">←</span>`:''}<span class="n ${n.st==='done'?'ok':(n.st==='urgent'?'blocked':'')}">${n.t}</span>`).join('')}
        </div>`).join(''):'<div class="empty">אין שרשראות תלות</div>'}
      </div>

      <div class="card pad">
        <div class="sec-head">${ic('clock',16)}<h2>עדכונים אחרונים</h2></div>
        ${recent.map(i=>`<div class="kv"><span class="k">${i.t}</span><span class="mono" style="font-size:11px;color:var(--ink-faint)">${i.time}</span></div>`).join('')||'<div class="empty">אין עדכונים</div>'}
      </div>
    </aside>
  </div>`;
}
function evBlock(ev){
  const i=ev.i, c=CATS[i.cat];
  const top=ev.s/60*ROW_H, h=Math.max(24,(ev.e-ev.s)/60*ROW_H);
  const n=ev.lanes||1, w=100/n, off=ev.lane*w;
  const faded=i.st==='done';
  return `<button class="tl-ev ${state.tlSel===i.id?'sel':''}" data-openitem="${i.id}" data-ev="${i.id}"
    style="top:${top}px;height:${h}px;inset-inline-start:calc(${off}% + 3px);width:calc(${w}% - 5px);
    --evb:${c.s};--evl:${c.c}55;--evc:${c.c};opacity:${faded?.6:1}">
    <div class="et">${i.st==='done'?'✓ ':''}${i.t}</div>
    ${h>40&&n<3?`<div class="em">${i.time} · ${i.who}</div>`:''}
  </button>`;
}
function buildChains(items){
  const byId=Object.fromEntries(items.map(i=>[i.id,i]));
  const isTarget=new Set(items.filter(i=>i.dep).map(i=>i.dep));
  const heads=items.filter(i=>!i.dep&&[...items].some(x=>x.dep===i.id));
  return heads.map(h=>{const ch=[h];let cur=h;
    while(true){const nx=items.find(x=>x.dep===cur.id);if(!nx)break;ch.push(nx);cur=nx;}
    return ch;}).filter(c=>c.length>1);
}
function drawDeps(){
  const grid=document.getElementById('tlGrid'), svg=document.getElementById('depSvg');
  if(!grid||!svg) return;
  const gr=grid.getBoundingClientRect();
  svg.setAttribute('width',gr.width); svg.setAttribute('height',gr.height);
  svg.setAttribute('viewBox',`0 0 ${gr.width} ${gr.height}`);
  const pos=id=>{const el=grid.querySelector(`[data-ev="${id}"]`);if(!el)return null;
    const r=el.getBoundingClientRect();return{x:r.left-gr.left+r.width/2,y:r.top-gr.top,y2:r.top-gr.top+r.height};};
  let out='';
  itemsOf(state.pid).forEach(i=>{
    if(!i.dep)return; const a=pos(i.dep),b=pos(i.id); if(!a||!b)return;
    const x1=a.x,y1=a.y2,x2=b.x,y2=b.y;
    const mid=(y1+y2)/2;
    out+=`<path d="M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}"/><circle cx="${x2}" cy="${y2}" r="2.2"/>`;
  });
  svg.innerHTML=out;
}

/* =========================================================================
   CONNECTORS (patient hub → category cards)
   ========================================================================= */
let __ro=null;
function observeCanvas(){
  const el=document.getElementById('mindmap'); if(!el) return;
  if(__ro) __ro.disconnect();
  __ro=new ResizeObserver(()=>drawConnectors());
  __ro.observe(el); el.querySelectorAll('.catcard').forEach(c=>__ro.observe(c));
}
function drawConnectors(){
  const wrap=document.getElementById('mindmap'), svg=document.getElementById('mmSvg'),
        hubEl=document.getElementById('hubInner');
  if(!wrap||!svg||!hubEl) return;
  const wr=wrap.getBoundingClientRect();
  if(wr.width<640){svg.innerHTML='';return}
  svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);
  const hr=hubEl.getBoundingClientRect();
  const hx=hr.left-wr.left+hr.width/2, hy=hr.top-wr.top+hr.height/2;
  let out='';
  wrap.querySelectorAll('.catcard').forEach(card=>{
    const cr=card.getBoundingClientRect();
    const cx=cr.left-wr.left+cr.width/2, cy=cr.top-wr.top+cr.height/2;
    const dx=cx-hx, dy=cy-hy, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    // start on hub rounded-rect edge
    const hs=edgePoint(hr.width/2+8,hr.height/2+8,ux,uy);
    const sx=hx+hs.x, sy=hy+hs.y;
    // end on card edge nearest hub
    const ce=edgePoint(cr.width/2+4,cr.height/2+4,-ux,-uy);
    const ex=cx+ce.x, ey=cy+ce.y;
    const mx=(sx+ex)/2, my=(sy+ey)/2;
    const c1x=sx+(mx-sx)*.55, c1y=sy+(my-sy)*.9;
    const c2x=ex-(ex-mx)*.55, c2y=ey-(ey-my)*.9;
    const hot = state.drag && card.dataset.cat===state.drag.cat;
    out+=`<path class="${hot?'hot':''}" d="M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${ex} ${ey}"/>`;
  });
  svg.innerHTML=out;
}
function edgePoint(hw,hh,ux,uy){
  const tx=ux!==0?hw/Math.abs(ux):Infinity, ty=uy!==0?hh/Math.abs(uy):Infinity;
  const t=Math.min(tx,ty); return {x:ux*t,y:uy*t};
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function bind(){
  const A=document.getElementById('app');
  const on=(sel,ev,fn)=>A.querySelectorAll(sel).forEach(e=>e.addEventListener(ev,fn));

  A.querySelector('#roleSel')?.addEventListener('change',e=>{
    state.role=e.target.value; state.view=NAV[state.role].groups[0].items[0][0]; render();
  });
  on('[data-theme]','click',e=>{state.theme=e.currentTarget.dataset.theme;render()});
  on('[data-nav]','click',e=>{state.view=e.currentTarget.dataset.nav;state.search='';render()});
  on('[data-open]','click',e=>{state.pid=e.currentTarget.dataset.open;state.view='canvas';render()});
  A.querySelectorAll('#pSwitch').forEach(s=>s.addEventListener('change',e=>{state.pid=e.target.value;render()}));

  const ts=A.querySelector('#topSearch');
  if(ts){ts.addEventListener('input',e=>{state.search=e.target.value;repaintContent()});
    if(state.search){ts.focus();ts.setSelectionRange(ts.value.length,ts.value.length)}}
  A.querySelector('#bellBtn')?.addEventListener('click',()=>toast('3 התראות פעילות: תוצאת CT, סיכום שחרור לחתימה, ייעוץ ממתין','bell'));

  /* canvas */
  on('[data-toggle-cat]','click',e=>{
    const k=e.currentTarget.dataset.toggleCat; state.open[k]=!state.open[k];
    repaintContent();
  });
  A.querySelector('#tbToggle')?.addEventListener('click',()=>{state.tbCollapsed=!state.tbCollapsed;repaintContent()});
  on('[data-tbcat]','click',e=>{const k=e.currentTarget.dataset.tbcat;state.tbOpen[k]=!state.tbOpen[k];repaintContent()});
  const tq=A.querySelector('#tbSearch');
  if(tq){tq.addEventListener('input',e=>{state.tbQuery=e.target.value;repaintContent();});
    if(state.tbQuery){const n=document.getElementById('tbSearch');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  on('[data-add]','click',e=>{e.stopPropagation();
    openScheduleModal(e.currentTarget.dataset.add,e.currentTarget.dataset.addcat,e.currentTarget.dataset.addcat,false)});

  /* toolbox drag source */
  on('.tb-item','dragstart',e=>{
    const el=e.currentTarget;
    state.drag={t:el.dataset.tool,cat:el.dataset.toolcat};
    e.dataTransfer.effectAllowed='copy';
    e.dataTransfer.setData('text/plain',JSON.stringify(state.drag));
    el.classList.add('drag');
    document.getElementById('mindmap')?.classList.add('dragging');
    paintDropTargets();
  });
  on('.tb-item','dragend',e=>{
    e.currentTarget.classList.remove('drag');
    state.drag=null; clearDropTargets();
  });

  /* category drop targets */
  on('.catcard','dragover',e=>{
    if(!state.drag)return; e.preventDefault(); e.dataTransfer.dropEffect='copy';
    e.currentTarget.classList.add('dropover');
  });
  on('.catcard','dragleave',e=>e.currentTarget.classList.remove('dropover'));
  on('.catcard','drop',e=>{
    e.preventDefault(); if(!state.drag)return;
    const dropped=e.currentTarget.dataset.cat, correct=state.drag.cat, title=state.drag.t;
    e.currentTarget.classList.remove('dropover');
    const routed = dropped!==correct;
    state.drag=null; clearDropTargets();
    openScheduleModal(title,correct,dropped,routed);
  });

  /* items */
  on('[data-openitem]','click',e=>{e.stopPropagation();openItemModal(e.currentTarget.dataset.openitem)});
  on('[data-toggle]','click',e=>{e.stopPropagation();
    const i=DATA.items.find(x=>x.id===e.currentTarget.dataset.toggle);
    i.st=i.st==='done'?'warn':'done';
    toast(i.st==='done'?`״${i.t}״ סומן כהושלם — עודכן בכל המסכים`:`״${i.t}״ הוחזר לפתוח`);
    render();
  });

  /* timeline */
  on('[data-range]','click',e=>{state.tlRange=e.currentTarget.dataset.range;repaintContent()});
  const sc=A.querySelector('#tlScroll'); if(sc) sc.scrollTop=5*ROW_H;

  /* kanban */
  on('[data-kitem]','dragstart',e=>{e.dataTransfer.setData('k',e.currentTarget.dataset.kitem);e.currentTarget.classList.add('drag')});
  on('[data-kitem]','dragend',e=>e.currentTarget.classList.remove('drag'));
  on('[data-drop]','dragover',e=>{e.preventDefault();e.currentTarget.classList.add('over')});
  on('[data-drop]','dragleave',e=>e.currentTarget.classList.remove('over'));
  on('[data-drop]','drop',e=>{e.preventDefault();e.currentTarget.classList.remove('over');
    const it=DATA.items.find(x=>x.id===e.dataTransfer.getData('k'));
    if(it){it.st=e.currentTarget.dataset.drop;toast(`״${it.t}״ עודכן ל־${STATUS[it.st]}`);render()}});
  on('[data-hitem]','dragstart',e=>{e.dataTransfer.setData('h',e.currentTarget.dataset.hitem);e.currentTarget.classList.add('drag')});
  on('[data-hitem]','dragend',e=>e.currentTarget.classList.remove('drag'));
  on('[data-hdrop]','dragover',e=>{e.preventDefault();e.currentTarget.classList.add('over')});
  on('[data-hdrop]','dragleave',e=>e.currentTarget.classList.remove('over'));
  on('[data-hdrop]','drop',e=>{e.preventDefault();e.currentTarget.classList.remove('over');
    const id=e.dataTransfer.getData('h');let f=null;
    for(const k of Object.keys(DATA.handoff)){const ix=DATA.handoff[k].findIndex(x=>x.id===id);
      if(ix>-1){f=DATA.handoff[k].splice(ix,1)[0];break}}
    if(f){DATA.handoff[e.currentTarget.dataset.hdrop].push(f);toast('הפריט הועבר במסירת המשמרת');render()}});
  A.querySelector('#confirmHandoff')?.addEventListener('click',()=>toast('מסירת המשמרת אושרה ותועדה'));

  /* manager */
  on('[data-auto]','click',e=>{const a=DATA.automations.find(x=>x.id===e.currentTarget.dataset.auto);
    a.on=!a.on;toast(a.on?`״${a.name}״ הופעלה`:`״${a.name}״ הושבתה`);render()});
  A.querySelector('#aCreate')?.addEventListener('click',()=>{
    const n=A.querySelector('#aName').value.trim()||'אוטומציה חדשה';
    DATA.automations.unshift({id:uid(),name:n,trigger:A.querySelector('#aTrig').value,action:A.querySelector('#aAct').value,on:true});
    toast(`האוטומציה ״${n}״ נוצרה והופעלה`);render();
  });

  /* family / patient / external */
  A.querySelector('#famQ')?.addEventListener('click',()=>toast('השאלה נשלחה לצוות המטפל'));
  A.querySelector('#famUpd')?.addEventListener('click',()=>{
    (DATA.familyMsgs.p1=DATA.familyMsgs.p1||[]).push({time:nowHM(),text:'הצוות עדכן: המטופל יציב, ממתינים לתוצאות ההדמיה.'});
    toast('התקבל עדכון חדש מהצוות');render();});
  A.querySelector('#extSend')?.addEventListener('click',()=>{
    const v=A.querySelector('#extOp'); if(!v.value.trim()){toast('נא להזין חוות דעת','alert');return}
    DATA.items.push({id:uid(),p:'p1',cat:'consults',t:'חוות דעת יועץ ריאות',st:'done',pr:'normal',who:'יועץ חיצוני',d:TODAY,time:nowHM(),dur:30,dep:null,note:v.value.trim()});
    v.value='';toast('חוות הדעת נשלחה ונוספה לתיק המטופל');render();});

  /* AI */
  A.querySelector('#aiSend')?.addEventListener('click',sendAI);
  A.querySelector('#aiIn')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendAI()});
  const cl=A.querySelector('#chatlog'); if(cl) cl.scrollTop=cl.scrollHeight;

  on('[data-acc]','click',e=>{const k='acc'+e.currentTarget.dataset.acc;state[k]=!state[k];repaintContent()});
  window.onresize=()=>{if(state.view==='canvas')drawConnectors();if(state.view==='timeline')drawDeps()};
}

function paintDropTargets(){
  document.querySelectorAll('.catcard').forEach(c=>{
    c.classList.remove('dropok','dimmed');
    if(!state.drag)return;
    c.classList.add(c.dataset.cat===state.drag.cat?'dropok':'dimmed');
  });
  drawConnectors();
}
function clearDropTargets(){
  document.querySelectorAll('.catcard').forEach(c=>c.classList.remove('dropok','dimmed','dropover'));
  document.getElementById('mindmap')?.classList.remove('dragging');
  drawConnectors();
}

/* =========================================================================

   ========================================================================= */
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function modalShell(title,icon,body){
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-back" id="mback"><div class="modal">
    <div class="modal-head"><span style="color:var(--accent)">${ic(icon,18)}</span><h3>${title}</h3>
      <button class="iconbtn" id="mclose" style="margin-inline-start:auto;width:30px;height:30px">${ic('x',14)}</button></div>
    <div class="modal-body">${body}</div>
  </div></div>`;
  document.getElementById('mback').addEventListener('click',e=>{if(e.target.id==='mback')closeModal()});
  document.getElementById('mclose').addEventListener('click',closeModal);
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){closeModal();document.removeEventListener('keydown',esc)}});
}

  modalShell(`הוספת פריט קליני`, c.icon, `
    ${routed?`<div class="pill warn" style="margin-bottom:12px;display:flex"><span class="dot"></span>
      שוחרר על ״${CATS[droppedOn].label}״ — נותב אוטומטית ל״${c.label}״ לפי סוג הפריט</div>`:''}
    <div class="row" style="gap:10px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:15px">
      <span class="cat-ic" style="--cc:${c.c};--ccs:${c.s};background:${c.s};color:${c.c}">${ic(c.icon,15)}</span>
      <div><div style="font-weight:800;font-size:14px">${title}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);font-weight:600">${c.label} · ${p.name} · חדר ${p.room}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div class="field"><label>תאריך</label><select id="fDay">
        ${DAYS.map((d,i)=>`<option value="${i}" ${i===TODAY?'selected':''}>${d}${i===TODAY?' (היום)':''}</option>`).join('')}</select></div>
      <div class="field"><label>שעה</label><input id="fTime" type="time" value="${nowHM()}"></div>
      <div class="field"><label>עדיפות</label><select id="fPr">
        ${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k==='normal'?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>אחראי</label><select id="fWho">
        <option>ד״ר לוי</option><option>ד״ר כהן</option><option>ד״ר גולן</option><option>אחות דנה</option>
        <option>אחות מיכל</option><option>עו״ס רונית</option><option>דיאטנית</option><option>פיזיותרפיה</option></select></div>
    </div>
    <div class="field"><label>תלות (הפריט יתחיל רק לאחר)</label><select id="fDep">
      <option value="">ללא תלות</option>
      ${deps.map(i=>`<option value="${i.id}">${i.t} · ${i.time}</option>`).join('')}</select></div>
    <div class="field"><label>הערות קליניות</label><textarea id="fNote" placeholder="הערה לצוות…"></textarea></div>
    <button class="btn primary block" id="fSave">${ic('plus',15)} הוסף לתיק המטופל</button>
    <p style="font-size:11px;color:var(--ink-faint);margin:10px 0 0;text-align:center">הפריט יופיע מיד בלוח המטופל, בציר הזמן, במשימות, בטבלה ובלוח המנהל</p>
  `);
  document.getElementById('fSave').addEventListener('click',()=>{
    const it={id:uid(),p:state.pid,cat,t:title,
      st:document.getElementById('fPr').value==='urgent'?'urgent':'warn',
      pr:document.getElementById('fPr').value,
      who:document.getElementById('fWho').value,
      d:+document.getElementById('fDay').value,
      time:document.getElementById('fTime').value||nowHM(),
      dur:30, dep:document.getElementById('fDep').value||null,
      note:document.getElementById('fNote').value.trim()};
    DATA.items.push(it);
    state.open[cat]=true;
    closeModal(); render();
    const card=document.querySelector(`.catcard[data-cat="${cat}"]`);
    if(card){card.classList.add('flash');card.scrollIntoView({block:'nearest',behavior:'smooth'})}
    toast(`״${title}״ נוסף ל${c.label} — מסונכרן בכל המסכים`);
  });

/* =========================================================================
   AI (mock, reads the same shared state)
   ========================================================================= */
function sendAI(){
  const el=document.getElementById('aiIn'); const t=el.value.trim(); if(!t)return;
  state.chat.push({from:'user',text:t});
  const p=P_(state.pid);
  let reply;
  if(/חוסם|חסם|שחרור/.test(t)){
    const b=itemsOf(p.id).filter(i=>i.st!=='done'&&(i.cat==='decisions'||i.cat==='documents'));
    reply=b.length?`מה שחוסם שחרור עבור ${p.name}: ${b.map(i=>i.t).join('، ')}. החסם המרכזי הוא ${p.blocker}.`:`אין כרגע חסמים מתועדים לשחרור עבור ${p.name}.`;
  } else if(/סיכום|מצב/.test(t)){
    const o=openItems(p.id);
    reply=`${p.name}, בן ${p.age}, יום אשפוז ${p.day}. אבחנה: ${p.dx}. יעד הטיפול: ${p.goal} (${p.progress}%). ${o.length} פריטים פתוחים, מתוכם ${o.filter(i=>i.pr==='urgent').length} בעדיפות דחופה.`;
  } else if(/משימה|צור|הוסף/.test(t)){
    const it={id:uid(),p:state.pid,cat:'tasks',t:'משימת מעקב (נוצרה ע״י העוזר)',st:'warn',pr:'normal',who:'ד״ר לוי',d:TODAY,time:nowHM(),dur:30,dep:null,note:t};
    DATA.items.push(it);
    reply=`נוצרה משימה חדשה עבור ${p.name} ושויכה לקטגוריית משימות. היא מופיעה כעת בלוח המטופל, בציר הזמן ובתצוגת הטבלה.`;
  } else if(/מחלקה|מטופלים/.test(t)){
    const a=DATA.patients.filter(x=>x.status!=='stable');
    reply=`במחלקה ${DATA.patients.length} מטופלים. ${a.length} דורשים תשומת לב: ${a.map(x=>x.name+' (חדר '+x.room+')').join('، ')}.`;
  } else {
    reply=`בהתבסס על הנתונים הנוכחיים של ${p.name}: ${p.summary}. הפעולה הבאה המומלצת — ${p.next}.`;
  }
  state.chat.push({from:'bot',text:reply});
  el.value=''; render();
}

render();
